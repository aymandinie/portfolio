<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapFix demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font:400 16px/1.4 "Inter Tight",system-ui,-apple-system,Arial,sans-serif;background:#f3eefc;color:#1a1326;min-height:100vh;display:grid;grid-template-columns:minmax(260px,420px) auto;gap:clamp(20px,5vw,70px);align-items:center;justify-content:center;padding:clamp(16px,4vw,48px)}
h1{font:700 clamp(30px,4vw,52px)/1 inherit;letter-spacing:-.03em;color:#6a12e0}p.s{margin:10px 0 22px;color:#4b3f63}
ol{list-style:none;display:grid;gap:6px}li button{width:100%;text-align:left;font:inherit;border:1px solid #d9cdf3;background:#fff;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:34px 1fr;gap:4px 10px;cursor:pointer;position:relative;overflow:hidden}
li button b{grid-row:1/3;align-self:center;width:30px;height:30px;border-radius:50%;background:#efe6ff;color:#6a12e0;display:grid;place-items:center;font-size:13px}
li button strong{font-weight:600}li button span{font-size:13px;color:#6b6180}li button em{position:absolute;left:0;bottom:0;height:3px;background:#7a1cf0;width:0}
li.on button{border-color:#7a1cf0;box-shadow:0 6px 20px -10px #7a1cf0}li.on button b{background:#7a1cf0;color:#fff}
.who{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:#efe6ff;color:#6a12e0;margin-left:6px}
.phone{width:min(330px,78vw);aspect-ratio:352/768;background:#111;border-radius:44px;padding:10px;box-shadow:0 40px 80px -40px rgba(60,20,120,.6)}.phone video{width:100%;height:100%;object-fit:cover;border-radius:34px;background:#fff;display:block}
@media(max-width:760px){body{grid-template-columns:1fr;justify-items:center}.phone{order:-1;width:min(250px,64vw)}li button span{display:none}}
</style></head><body>
<div><h1>SnapFix</h1><p class="s">A recording of the real apps, one step at a time. Pick a step or let it play through.</p><ol id="l"></ol></div>
<div class="phone"><video id="v" muted playsinline autoplay></video></div>
<script>
const S=[['01-customer-home','Open the app','Home, offers and categories','Customer'],['02-customer-browse-services','Find a service','Plumbing list and service detail','Customer'],['03-customer-book-service','Book it','Date, address and price up front','Customer'],['04-contractor-accepts-job','Job accepted','The contractor confirms','Contractor'],['05-contractor-otp-job-progress','Verify and start','OTP at the door, then in progress','Contractor'],['06-customer-payment','Pay','Cashless, in the app','Customer'],['07-customer-review','Rate the job','Stars and a comment','Customer']];
const l=document.getElementById('l'),v=document.getElementById('v');let i=0;
l.innerHTML=S.map((s,k)=>`<li><button data-k="${k}"><b>${k+1}</b><strong>${s[1]}<i class="who">${s[3]}</i></strong><span>${s[2]}</span><em></em></button></li>`).join('');
function go(k){i=(k+S.length)%S.length;v.src='clips/'+S[i][0]+'.mp4';v.play().catch(()=>{});[...l.children].forEach((li,q)=>{li.classList.toggle('on',q===i);li.querySelector('em').style.width='0';});}
l.onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.k);};v.onended=()=>go(i+1);
v.ontimeupdate=()=>{const em=l.children[i].querySelector('em');if(v.duration)em.style.width=(v.currentTime/v.duration*100)+'%';};go(0);
</script></body></html>
