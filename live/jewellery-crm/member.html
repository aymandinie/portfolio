<style>
  /* Deep brand-navy canvas (never pure black, never warm tints) */
  html,body { background:#011827; }
  .pwa-shell {
    background:#022135;
    color:#fff;
    min-height:100vh;
    min-height:100dvh;
    max-width:440px;
    margin:0 auto;
    position:relative;
    box-shadow:0 0 50px rgba(0,0,0,0.45);
    display:flex;
    flex-direction:column;
  }
  .pwa-header {
    color:#fff;
    padding:52px 20px 20px;
    position:relative;
  }
  .pwa-bottom-nav {
    position:sticky; bottom:0;
    background:#011827;
    border-top:1px solid #1A3F58;
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
    padding:8px 0 16px;
    z-index:30;
  }
  /* F21 — raised centre "Refer" hero tab */
  .bottom-nav-hero {
    display:flex; flex-direction:column; align-items:center; gap:5px;
    color:var(--gold); font-size:11px; font-weight:600; cursor:pointer;
    margin-top:-26px; text-decoration:none;
  }
  .bottom-nav-hero-btn {
    width:52px; height:52px; border-radius:50%;
    background:var(--gold-grad); color:var(--navy);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px -6px rgba(242,194,26,0.55), 0 0 0 4px #011827;
    transition:transform .12s ease;
  }
  .bottom-nav-hero:active .bottom-nav-hero-btn { transform:scale(.94); }
  .bottom-nav-hero-btn svg { width:24px; height:24px; }
  .bottom-nav-hero-label { color:var(--icon-inactive); font-weight:500; }
  .bottom-nav-hero.active .bottom-nav-hero-label { color:var(--gold); }
  .pwa-shell.theme-light .bottom-nav-hero-btn { box-shadow:0 8px 20px -6px rgba(242,194,26,0.55), 0 0 0 4px #FFFFFF; }
  .pwa-shell.theme-light .bottom-nav-hero-label { color:#9AA8B2; }
  .pwa-shell.theme-light .bottom-nav-hero.active .bottom-nav-hero-label { color:#9A7A00; }  /* active hero label = gold in light mode too */
  /* F24 — portal bottom-sheet surface (theme-aware) */
  .portal-sheet { background:#0A3A57; color:#fff; }
  .pwa-shell.theme-light .portal-sheet { background:#FFFFFF; color:#022135; }
  /* Brand logo colour vs surface: brand tone on the light theme; white on the dark theme +
     on always-dark surfaces (sign-in gate, membership card). logo-full.png is transparent RGBA. */
  .portal-brand { transition: filter .2s ease; }
  .pwa-shell:not(.theme-light) .portal-brand { filter: brightness(0) invert(1); }
  .portal-brand.always-white { filter: brightness(0) invert(1); }
  /* F25 — Bella ambassador hero band behind the Home greeting/wallet.
     Drop assets/ambassador-bella.jpg in and it shows through the scrim. */
  .home-hero-band {
    /* Portrait-silhouette placeholder (gold bust). Sits UNDER the real image slot,
       so dropping assets/ambassador-bella.jpg in simply covers it. */
    --bella-ph: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20240%20300%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23F6D66A%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%239A6E15%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cg%20fill%3D%22url(%23g)%22%3E%3Cpath%20d%3D%22M120%2026c32%200%2052%2024%2052%2056%200%2018-7%2032-19%2042%203%2010%2011%2015%2022%2018%2018%205%2031%2015%2038%2031%2010%2024%2013%2071%2013%20101H14c0-30%203-77%2013-101%207-16%2020-26%2038-31%2011-3%2019-8%2022-18-12-10-19-24-19-42%200-32%2020-56%2052-56z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
    position:absolute; top:0; left:0; right:0; height:340px; z-index:0; pointer-events:none;
    background:
      radial-gradient(130% 90% at 88% -10%, rgba(242,194,26,0.28), transparent 55%),
      linear-gradient(180deg, rgba(1,24,39,0) 34%, #011827 96%),
      image-set(url('assets/ambassador-bella.jpg') 1x),
      var(--bella-ph);
    background-size: cover, cover, cover, auto 300px;
    background-position: center, center, 78% 12%, right -12px bottom;
    background-repeat: no-repeat;
    opacity:.92;
  }
  .pwa-header { position:relative; }
  .pwa-header > *:not(.home-hero-band) { position:relative; z-index:1; }
  .home-hero-tag {
    display:inline-flex; align-items:center; gap:5px; margin-bottom:14px;
    font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:#3D2C05; background:var(--gold-grad); padding:4px 10px 4px 8px; border-radius:999px;
  }
  .home-hero-tag svg { width:12px; height:12px; }
  .pwa-shell.theme-light .home-hero-band {
    background:
      radial-gradient(130% 90% at 88% -10%, rgba(242,194,26,0.30), transparent 55%),
      linear-gradient(180deg, rgba(238,241,244,0) 30%, var(--app-bg,#EEF1F4) 96%),
      image-set(url('assets/ambassador-bella.jpg') 1x),
      var(--bella-ph);
    background-size: cover, cover, cover, auto 300px;
    background-position: center, center, 78% 12%, right -12px bottom;
    background-repeat: no-repeat;
  }
  /* Bella ambassador photo placeholder — a portrait frame pinned top-right of the Home
     hero. Drop assets/ambassador-bella.jpg in and it fills the frame; until then it
     reads unmistakably as a placeholder (dashed frame + person glyph + "BELLA"). */
  .gf-bella-portrait {
    width:66px; height:84px; border-radius:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1.5px dashed #55708A; background:rgba(255,255,255,0.04);
    background-image:image-set(url('assets/ambassador-bella.jpg') 1x);
    background-size:cover; background-position:center top;
  }
  .pwa-content { padding-bottom:84px; flex:1 0 auto; }

  /* Interactive 3D membership card — tilts toward the pointer/tilt with a moving gold glare */
  .card-stage { perspective:1100px; }
  .card-stage .wallet-card {
    transition:transform .12s ease-out;
    will-change:transform;
    transform:rotateX(0deg) rotateY(0deg);
  }
  .card-glare {
    position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:2;
    background:radial-gradient(circle at 70% 12%, rgba(255,255,255,0.16), transparent 55%);
    mix-blend-mode:screen; transition:background .12s ease-out;
  }
  .wallet-card { box-shadow:0 24px 48px -18px rgba(0,0,0,0.6), 0 2px 0 rgba(191,164,111,0.25) inset; }
  /* keep real content above the glare */
  .wallet-card > *:not(.card-glare) { position:relative; z-index:3; }

  .qr-fake {
    width:100%; aspect-ratio:1; background:white;
    background-image:
      repeating-linear-gradient(0deg, #000 0 4px, transparent 4px 8px),
      repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 8px);
    mask:
      radial-gradient(circle at 16% 16%, transparent 12%, black 13%),
      radial-gradient(circle at 84% 16%, transparent 12%, black 13%),
      radial-gradient(circle at 16% 84%, transparent 12%, black 13%);
    -webkit-mask-composite: source-over;
  }
</style>
</head>
<body>

<div class="pwa-shell">
  <!-- Phone status bar -->
  <div class="absolute top-0 left-0 right-0 flex justify-between items-center px-6 py-3 text-white text-xs font-medium z-50 pointer-events-none">
    <span>9:41</span>
    <div class="flex items-center gap-1">
      <span>·· 5G</span>
      <svg class="w-4 h-3" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="0" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="2" width="9" height="6" fill="currentColor"/><rect x="14" y="3" width="2" height="4" fill="currentColor"/></svg>
    </div>
  </div>

  <main id="pwaContent" class="pwa-content"></main>

  <!-- Bottom nav -->
  <nav class="pwa-bottom-nav" id="bottomNav"></nav>

  <!-- Portal bottom-sheet (F24 request-an-update, etc.) -->
  <div id="portalSheet" class="hidden" style="position:fixed;inset:0;z-index:120;">
    <div style="position:absolute;inset:0;background:rgba(1,15,25,.6)" onclick="closeSheet()"></div>
    <!-- Sheet is capped to the phone-shell width (440px) and centred, so on a desktop it sits
         inside the phone column instead of stretching edge-to-edge. On mobile it's full-width. -->
    <div id="portalSheetBody" class="sheet-enter portal-sheet" style="position:absolute;left:0;right:0;bottom:0;margin-left:auto;margin-right:auto;width:100%;max-width:440px;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom))"></div>
  </div>
</div>

<script src="assets/qrcode.min.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/data.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/components.js"></script>
<script>
/* Real scannable QR (navy modules on white) — falls back to a placeholder if the lib is absent */
function qrSvg(text, opts) {
  opts = opts || {};
  if (typeof qrcode === 'undefined') return '<div class="qr-fake w-full h-full"></div>';
  const qr = qrcode(0, opts.ec || 'M');
  qr.addData(text); qr.make();
  const n = qr.getModuleCount();
  const cell = opts.cell || 6, margin = (opts.margin != null ? opts.margin : 1);
  const size = (n + margin*2) * cell, dark = opts.dark || '#022135';
  let rects = '';
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (qr.isDark(r,c)) rects += `<rect x="${(c+margin)*cell}" y="${(r+margin)*cell}" width="${cell}" height="${cell}"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="100%" height="100%" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="#fff"/><g fill="${dark}">${rects}</g></svg>`;
}

/* Portal date helpers — demo clock pinned to 15 May 2026 (matches engine/admin). */
const PORTAL_TODAY = '2026-05-15';
const _PMON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDMY(s){ if(!s) return ''; const d=new Date(s); if(isNaN(d)) return s; return d.getDate()+' '+_PMON[d.getMonth()]+' '+d.getFullYear(); }
function daysUntil(iso){ if(!iso) return null; const d=new Date(iso), t=new Date(PORTAL_TODAY+'T00:00:00'); return Math.round((d-t)/864e5); }
// Plan lifecycle from real fields (paidMonths/totalMonths/status) — never a hardcoded badge.
function planUiStatus(p){
  const done = (p.paidMonths||0) >= p.totalMonths || p.status==='elapsed';
  if (done) return { key:'done',  label:'Completed' };
  if ((p.totalMonths - (p.paidMonths||0)) <= 1 || p.status==='final') return { key:'final', label:'Final month' };
  return { key:'active', label:'On track' };
}
// The member's soonest-due active plan (for Home 'Up Next'); null if none upcoming.
function memberUpNextPlan(me){
  return (GF_DATA.atomePlans||[])
    .filter(p => p.memberId===me.id && p.nextDate && !((p.paidMonths||0)>=p.totalMonths || p.status==='elapsed'))
    .sort((a,b)=> new Date(a.nextDate) - new Date(b.nextDate))[0] || null;
}

/* F21 — client decision: 5 tabs with Refer raised in the centre (hero slot).
   Home · Card · Refer · Rewards · Profile. Refer routes to the referral ledger. */
const NAV = [
  { id:'home',    label:'Home',    icon:'home' },
  { id:'wallet',  label:'Card',    icon:'wallet' },
  { id:'rewards', label:'Rewards', icon:'star', hero:true },   // main action — centre hero
  { id:'refer',   label:'Refer',   icon:'gift', href:'account/referral' },
  { id:'account', label:'Profile', icon:'user' }
];

/* Brand logo lockup (falls back to the badge SVG until the PNG export is dropped in) */
const LOGO = `<a href="index.html" aria-label="Back to Goldfinch home" class="inline-flex"><img src="assets/logo-full.png" onerror="this.onerror=null;this.src='assets/logo.svg'" alt="Goldfinch Jewelry" class="portal-brand h-14 w-auto" /></a>`;

/* Light / dark theme — ZAC delivers a light variant alongside the dark Portal for evaluation */
let PORTAL_THEME = 'light';
function applyTheme() {
  const sh = document.querySelector('.pwa-shell');
  // The sign-in SCREEN (the phone) stays a dark premium screen regardless of theme — force dark
  // while signed out. (The frame/sides around it are lightened via html.signin-frame.)
  const lightNow = PORTAL_THEME === 'light' && (typeof SIGNED_IN === 'undefined' || SIGNED_IN);
  if (sh) sh.classList.toggle('theme-light', lightNow);
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute('content', lightNow ? '#EEF1F4' : '#022135');
}
function toggleTheme() {
  PORTAL_THEME = PORTAL_THEME === 'light' ? 'dark' : 'light';
  applyTheme();
  toast(PORTAL_THEME === 'light' ? 'Light theme on' : 'Dark theme on', 'success');
  route();
}

/* F23 — English + Bahasa Melayu. The whole portal translates: nav labels via t() below, and every
   other rendered string via the shared DOM localiser (assets/i18n.js localizeDOM), driven by
   PORTAL_LANG. The member's choice is remembered in localStorage (gf_portal_lang). */
let PORTAL_LANG = (function(){ try { return localStorage.getItem('gf_portal_lang') || 'en'; } catch(e){ return 'en'; } })();
const I18N = {
  en: { 'nav.home':'Home','nav.wallet':'Card','nav.refer':'Refer','nav.rewards':'Rewards','nav.account':'Profile',
        'home.refer':'Refer & Earn','home.share':'Share on WhatsApp','home.featured':'Featured',
        'lang.title':'Language','lang.note':'Switches the entire portal — labels and content — to your chosen language.' },
  ms: { 'nav.home':'Utama','nav.wallet':'Kad','nav.refer':'Rujuk','nav.rewards':'Ganjaran','nav.account':'Profil',
        'home.refer':'Rujuk & Menang','home.share':'Kongsi di WhatsApp','home.featured':'Pilihan',
        'lang.title':'Bahasa','lang.note':'Menukar keseluruhan portal — label dan kandungan — ke bahasa pilihan anda.' }
};
function t(key, fallback){ const d=I18N[PORTAL_LANG]||I18N.en; return d[key]!=null?d[key] : (I18N.en[key]!=null?I18N.en[key] : (fallback!=null?fallback:key)); }
// Keep the DOM localiser's language flag in step with the portal's choice (no gf_lang write — that
// key belongs to the CRM cashier toggle; the portal persists its own gf_portal_lang).
function syncPortalLang(){ if (typeof window !== 'undefined') window.GF_LANG = (PORTAL_LANG === 'ms') ? 'ms' : 'en'; }
syncPortalLang();
function setLang(l){ PORTAL_LANG=l; try { localStorage.setItem('gf_portal_lang', l); } catch(e){} syncPortalLang(); renderNav(); route(); toast(l==='ms'?'Bahasa ditukar ke Bahasa Melayu':'Language set to English','success'); }

function renderNav() {
  const hash = location.hash.replace('#','') || 'home';
  const cur = hash.split('/')[0];
  const onRefer = hash.startsWith('account/referral');
  document.getElementById('bottomNav').innerHTML = NAV.map(n => {
    const href = n.href || n.id;
    // Active by tab identity (not by the hero slot). Refer lives under the account/referral
    // route, so it — not Profile — lights up there. Rewards (the hero) lights on #rewards.
    const active = n.id === 'refer'   ? onRefer
                 : n.id === 'account' ? (cur === 'account' && !onRefer)
                 : (n.id === cur);
    const label = t('nav.'+n.id, n.label);
    if (n.hero) {
      return `<a href="#${href}" class="bottom-nav-hero ${active?'active':''}" aria-label="${label}"><span class="bottom-nav-hero-btn">${ICONS[n.icon]}</span><span class="bottom-nav-hero-label">${label}</span></a>`;
    }
    return `<a href="#${href}" class="bottom-nav-item ${active?'active':''}">${ICONS[n.icon]}<span>${label}</span></a>`;
  }).join('');
}

const RENDERERS = {};

/* Lightweight session gate (demo only — no real auth). Signing out shows the
   branded sign-in screen; signing in returns to Home. */
let SIGNED_IN = true;

/* §3.4 NavStack — the portal back stack. No back control hardcodes a
   destination; back reads the stack, and a cold deep-link falls back to the
   screen's logical parent (not Home). Scroll position is restored per entry. */
const BACK = { stack: [], scroll: {}, popping: false };
const PARENT = { account: 'home', rewards: 'home', wallet: 'home', home: null };
function currentHash() { return location.hash.replace('#', '') || 'home'; }
function parentOf(hash) {
  const [section] = hash.split('/');
  return hash.includes('/') ? section : (PARENT[section] != null ? PARENT[section] : 'home');
}
function goBack() {
  if (BACK.stack.length > 1) {
    BACK.stack.pop();                         // drop current
    BACK.popping = true;
    location.hash = BACK.stack[BACK.stack.length - 1];
  } else {
    const parent = parentOf(currentHash());
    BACK.popping = true;
    location.hash = parent || 'home';
  }
}
function backLabel() {
  const dest = BACK.stack.length > 1 ? BACK.stack[BACK.stack.length - 2] : parentOf(currentHash());
  const sec = (dest || 'home').split('/')[0];
  return ({ home: 'Home', account: 'Profile', rewards: 'Rewards', wallet: 'Card' })[sec] || 'Back';
}

function route() {
  const hash = currentHash();
  let [section, sub] = hash.split('/');
  if (!section) section = 'home';
  const nav = document.getElementById('bottomNav');

  if (!SIGNED_IN) {
    const pc = document.getElementById('pwaContent');
    pc.classList.add('signin-bg');           // premium dark gold-texture backdrop for sign-in
    document.documentElement.classList.add('signin-frame');   // white sides around the phone
    pc.innerHTML = signInScreen();
    if (nav) nav.style.display = 'none';
    window.scrollTo(0, 0);
    applyTheme();
    syncPortalLang();
    if (typeof localizeDOM === 'function') localizeDOM(pc);
    return;
  }
  document.getElementById('pwaContent').classList.remove('signin-bg');
  document.documentElement.classList.remove('signin-frame');

  // Maintain the stack: forward nav pushes + saves outgoing scroll; back pops.
  if (BACK.popping) {
    BACK.popping = false;
  } else {
    const top = BACK.stack[BACK.stack.length - 1];
    if (top != null) BACK.scroll[top] = window.scrollY;
    if (top !== hash) BACK.stack.push(hash);
  }

  if (nav) nav.style.display = '';
  renderNav();
  const r = RENDERERS[section];
  // §C.2 — real fallback so an unknown hash never freezes the previous screen.
  const pc = document.getElementById('pwaContent');
  pc.innerHTML = r ? r(sub) : renderNotFound(hash);
  // Full-portal BM: translate every rendered string (nav labels already come from t()).
  syncPortalLang();
  if (typeof localizeDOM === 'function') { localizeDOM(pc); if (nav) localizeDOM(nav); }
  mountCard3D();
  applyTheme();
  // §C.3 — restore scroll on back; top of page on forward.
  const y = BACK.scroll[hash];
  window.scrollTo(0, y != null ? y : 0);
  if (y != null) delete BACK.scroll[hash];
}
function renderNotFound(hash) {
  return `
    <header class="pwa-header" style="padding-bottom:16px;">
      <button type="button" onclick="goBack()" class="text-slate-300 hover:text-white flex items-center gap-1 text-sm transition"><span class="w-5 h-5">${ICONS.chevL}</span><span>${backLabel()}</span></button>
    </header>
    <section class="px-5 py-16 text-center">
      <div class="text-2xl text-white font-light mb-2">Page not found</div>
      <p class="text-sm text-slate-300 mb-6">We couldn't find <span class="font-mono-tight">#${(hash||'').replace(/</g,'&lt;')}</span>.</p>
      <button type="button" class="btn-gold mx-auto" onclick="location.hash='home'">Back to Home</button>
    </section>`;
}
window.addEventListener('hashchange', route);
window.goBack = goBack;

function signOut() {
  SIGNED_IN = false;
  route();
}
function signIn() {
  SIGNED_IN = true;
  if ((location.hash.replace('#','')||'home').split('/')[0] !== 'home') { location.hash = 'home'; }
  route();
  toast('Welcome back, ' + GF_DATA.me.firstName, 'success');
}
function signInScreen() {
  return `
    <div class="min-h-screen flex flex-col justify-center px-7 py-10 relative overflow-hidden">
      <div class="gf-signin-dust">${[[14,0,4.4,4],[30,1.2,5.0,3],[52,.5,4.1,5],[70,1.7,5.2,3],[86,.3,4.6,4],[22,2.5,4.8,3],[64,2.1,5.1,4]].map(([l,d,dur,sz])=>`<i style="left:${l}%;width:${sz}px;height:${sz}px;animation-delay:${d}s;animation-duration:${dur}s"></i>`).join('')}</div>
      <div class="relative flex flex-col items-center text-center">

/* Interactive 3D card: tilt toward pointer (desktop) or device tilt (mobile) + moving glare */
function mountCard3D() {
  document.querySelectorAll('.card-stage').forEach(stage => {
    const card  = stage.querySelector('.wallet-card');
    const glare = stage.querySelector('.card-glare');
    if (!card) return;
    let raf = null;
    const apply = (px, py) => {
      const ry = (px - 0.5) * 26;    // rotateY (left/right)
      const rx = -(py - 0.5) * 18;   // rotateX (up/down)
      card.style.transform = `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
      if (glare) glare.style.background =
        `radial-gradient(circle at ${(px*100).toFixed(0)}% ${(py*100).toFixed(0)}%, rgba(255,255,255,0.32), rgba(250,200,5,0.06) 32%, transparent 62%)`;
    };
    const fromEvent = e => {
      const t = e.touches ? e.touches[0] : e;
      const r = stage.getBoundingClientRect();
      const px = Math.min(1, Math.max(0, (t.clientX - r.left) / r.width));
      const py = Math.min(1, Math.max(0, (t.clientY - r.top) / r.height));
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => apply(px, py));
    };
    const reset = () => {
      if (raf) cancelAnimationFrame(raf);
      card.style.transform = 'rotateX(0deg) rotateY(0deg)';
      if (glare) glare.style.background = 'radial-gradient(circle at 70% 12%, rgba(255,255,255,0.16), transparent 55%)';
    };
    stage.addEventListener('pointermove', fromEvent);
    stage.addEventListener('pointerleave', reset);
    stage.addEventListener('touchmove', fromEvent, { passive: true });
    stage.addEventListener('touchend', reset);
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', ev => {
        if (ev.gamma == null) return;
        apply(0.5 + ev.gamma / 45, 0.5 + (ev.beta - 35) / 45);
      });
    }
  });
}

/* Points ledger — a member-specific feed: purchase rewards derived from the member's own ledger
   history (earned by gold grade) + explicit events (bonuses, redemptions). Newest first. */
function memberPointsFeed() {
  const me = GF_DATA.me;
  const rateFor = g => g === '999.9' ? 10 : g === '916' ? 5 : 2;
  const purchases = ((GF_DATA.purchaseHistory && GF_DATA.purchaseHistory[me.id]) || []).map(p => ({
    type: 'earn', label: 'Purchase reward',
    points: Math.floor((p.amount || 0) / rateFor(p.grade)),
    date: p.date, meta: `${(p.item || '').split(' +')[0]} · ${p.outlet || ''}`, invoice: p.invoice
  })).filter(x => x.points > 0);
  const events = (GF_DATA.activity || []).filter(a => a.label !== 'Purchase reward'); // bonuses + redemptions
  const D = s => { const d = new Date(s); return isNaN(d.getTime()) ? 0 : d.getTime(); };
  return [...purchases, ...events].sort((a, b) => D(b.date) - D(a.date));
}

// Human "redeemable at" line from a voucher's scoping (empty = network-wide).
function portalVoucherWhere(v){
  const st = (v && v.states)||[], ot = (v && v.outlets)||[];
  if (!st.length && !ot.length) return 'Any Goldfinch outlet, nationwide';
  const parts = [];
  if (st.length) parts.push(st.join(', '));
  if (ot.length) {
    // Resolve outlet CODES to names so the member can actually tell where it's valid.
    const oName = {}; (GF_DATA.outlets||[]).forEach(o => oName[o.code] = o.name);
    const names = ot.map(c => oName[c] || c);
    parts.push(names.length <= 2 ? names.join(' & ') : (names.slice(0,2).join(', ') + ' +' + (names.length-2) + ' more'));
  }
  return parts.join(' · ');
}
// One filter for the member's wallet — so the Active/Used/Locked COUNTS and the rendered LIST always
// agree (win-back is hidden for non-lapsing members, and that must apply to the badges too).
function walletVoucherCount(kind){
  const lapsing = (typeof isLapsingMember==='function') && isLapsingMember(GF_DATA.me);
  return (GF_DATA.vouchers||[]).filter(v => {
    if (v.winback && !lapsing) return false;
    if (kind==='used') return v.status==='used' || v.status==='expired';
    if (kind==='locked') return v.status==='locked';
    return v.status==='active';
  }).length;
}

function confirmRedeemPoints(cost, value){
  const me = GF_DATA.me;
  const bal = me.pointsBalance != null ? me.pointsBalance : me.points;
  if (bal < cost){ toast('Not enough redeemable points', 'warn'); return; }
  // Spend REDEEMABLE only — status/qualifying points untouched so the tier never drops on a claim.
  me.points -= cost;
  if (me.pointsBalance != null) me.pointsBalance = me.points;

  // Voucher validity = 6 months from issue (CRM Pending Matters 3.7).
  const exp = new Date(PORTAL_TODAY + 'T00:00:00'); exp.setMonth(exp.getMonth() + 6);
  const expISO = exp.toISOString().slice(0, 10);
  const v = {

}

// ---- Referral credit → voucher conversion ----------------------------------------------------
// Referral rewards accrue as a POOL of credit (RM 2/g, voucher-only). The member converts it into
// vouchers in RM 10 steps; each conversion mints an Active voucher into Rewards and draws the pool
// down. Never cash. me.referralConverted tracks how much of the earned pool has been converted.
let REF_CONVERT_AMT = 10;
function referralCreditMax(){
  const me = GF_DATA.me;
  const earned = (typeof referralTotals === 'function') ? referralTotals(me.id).earned : (me.referralEarned || 0);
  return Math.floor(Math.max(0, earned - (me.referralConverted || 0)) / 10) * 10;   // whole RM 10 units
}
function openReferralConvert(){
  const max = referralCreditMax();
  if (max < 10){ toast('You need at least RM 10 of referral credit to convert', 'warn'); return; }
  REF_CONVERT_AMT = Math.min(Math.max(10, REF_CONVERT_AMT), max);
  openSheet(referralConvertInner(max));
}
function referralConvertInner(max){
  const amt = REF_CONVERT_AMT;
  const chip = (v,label) => `<button type="button" onclick="setReferralConvert(${v},${max})" class="text-[11px] px-3 py-1.5 rounded-full ${amt===v?'bg-gold-500 text-navy-950 font-medium':'text-slate-300'}" style="${amt===v?'':'background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)'}">${label}</button>`;
  const stepBtn = (delta,sym,off) => `<button type="button" onclick="stepReferralConvert(${delta},${max})" ${off?'disabled':''} class="w-11 h-11 rounded-full flex items-center justify-center text-2xl ${off?'opacity-30':''}" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)">${sym}</button>`;
  return `
    <div class="text-center">
      <div class="w-10 h-1 rounded-full mx-auto mb-4" style="background:currentColor;opacity:.18"></div>
      <div class="text-[10px] tracking-[0.2em] uppercase text-gold-500 font-medium mb-1">Convert referral credit</div>
      <div class="text-xs opacity-70 mb-5">Turn credit into an in-store voucher · RM 10 steps</div>
      <div class="flex items-center justify-center gap-4 mb-3">
        ${stepBtn(-10,'−',amt<=10)}
        <div class="min-w-[130px]"><div class="display text-4xl text-white leading-none">RM ${fmtNum(amt)}</div><div class="text-[10px] opacity-55 mt-1">voucher value</div></div>
        ${stepBtn(10,'+',amt>=max)}
      </div>
      <div class="flex items-center justify-center flex-wrap gap-2 mb-5">
        ${[10,50,100].filter(v=>v<=max).map(v=>chip(v,'RM '+v)).join('')}${chip(max,'Max RM '+fmtNum(max))}
      </div>
      <div class="rounded-xl p-4 mb-4 text-left" style="background:rgba(250,200,5,.08);border:1px solid rgba(250,200,5,.22)">
        <div class="flex items-center justify-between text-sm"><span class="opacity-70">Credit available</span><span class="font-medium">RM ${fmtNum(max)}</span></div>
        <div class="flex items-center justify-between text-sm mt-1.5 pt-1.5" style="border-top:1px solid rgba(255,255,255,.08)"><span class="opacity-70">After converting</span><span class="font-medium text-gold-500">RM ${fmtNum(max-amt)}</span></div>
      </div>
      <div class="text-[11px] opacity-60 mb-5 flex items-start gap-1.5"><span class="w-3.5 h-3.5 text-gold-500 flex-shrink-0 mt-px">${ICONS.tag||ICONS.gift||''}</span><span>The voucher lands in <b>Rewards</b> as Active (valid 3 months). Voucher-only — no cash value.</span></div>
      <button type="button" class="btn-gold w-full justify-center !py-3 mb-1" onclick="convertReferralToVoucher(${amt})">Convert · RM ${fmtNum(amt)} voucher</button>
      <button type="button" class="w-full text-center text-xs py-2.5" style="opacity:.55" onclick="closeSheet()">Not now</button>
    </div>`;
}
// In-place re-render (no re-animation) so the stepper feels instant.
function reRenderReferralConvert(max){ const b = document.getElementById('portalSheetBody'); if (b) { b.innerHTML = referralConvertInner(max); if (typeof localizeDOM === 'function') localizeDOM(b); } }
function stepReferralConvert(delta, max){ REF_CONVERT_AMT = Math.min(max, Math.max(10, REF_CONVERT_AMT + delta)); reRenderReferralConvert(max); }
function setReferralConvert(v, max){ REF_CONVERT_AMT = Math.min(max, Math.max(10, v)); reRenderReferralConvert(max); }
function convertReferralToVoucher(amt){
  const me = GF_DATA.me;
  const avail = referralCreditMax();
  if (amt < 10 || amt % 10 !== 0 || amt > avail){ toast('Choose an amount in RM 10 steps within your credit', 'warn'); return; }
  me.referralConverted = (me.referralConverted || 0) + amt;
  const seq = (GF_DATA._refSeq = (GF_DATA._refSeq || 0) + 1);
  const exp = new Date(PORTAL_TODAY + 'T00:00:00'); exp.setMonth(exp.getMonth() + 3);   // referral vouchers valid 3 months
  const expISO = exp.toISOString().slice(0, 10);
  const v = {
    id: 'V-REF-' + String(1000 + seq),
    title: 'RM ' + amt + ' OFF · Referral reward',
    subtitle: 'Converted from referral credit',
    tier: 'All Tiers', expires: fmtDMY(expISO), claimedOn: fmtDMY(PORTAL_TODAY),
    code: 'REF' + amt + '-' + String(1000 + seq),
    status: 'active', memberId: me.id,
    terms: 'Converted from referral credit. Valid 3 months from issue. Cannot be used to offset the workmanship fee (upah). One voucher per transaction; unused balance forfeited. Non-transferable, no cash value. Goldfinch Group Berhad reserves the right to amend the terms and conditions without prior notice.'
  };

/* §8.3 — detect the platform so the right wallet button leads. UA detection
   fails often enough that the other must always remain reachable. */
function walletPlatform() {
  const uaD = navigator.userAgentData;
  const plat = (uaD && uaD.platform) || navigator.platform || '';
  const ua = navigator.userAgent;
  if (/Android/i.test(ua)) return 'google';
  if (/iPhone|iPod|iPad/i.test(ua)) return 'apple';
  if (/Mac/i.test(plat) && navigator.maxTouchPoints > 1) return 'apple';   // iPadOS as macOS
  return 'both';
}

// §1.4 / §8.2 — consent model. Each toggle writes GF_DATA.me.optIn and appends a
// consentLog entry so the state is real: the CRM broadcast reach reads the same field.
function optIn() {
  const o = GF_DATA.me.optIn = GF_DATA.me.optIn || {};
  o.marketing  = o.marketing  || { whatsapp:false, sms:false };
  o.reminders  = o.reminders  || { whatsapp:false, sms:false };
  o.consentLog = o.consentLog || [];
  return o;
}
// group: 'marketing' | 'reminders'; channel: 'whatsapp' | 'sms'. confirmMsg gates opt-OUT.
function setOptIn(group, channel, confirmMsg) {
  const o = optIn();
  const g = o[group] = o[group] || {};
  const next = !g[channel];
  if (!next && confirmMsg && !confirm(confirmMsg)) return;   // may miss a payment reminder
  g[channel] = next;
  o.consentLog.push({ channel: group + '.' + channel, value: next, ts: new Date().toISOString(), source: 'member-portal' });
  toast(next ? 'Opted in — you’ll receive these' : 'Opted out — you won’t receive these', 'success');
  route();
}
// Real toggle bound to optIn state. locked=always-on (transactional). confirm=opt-out gate.
function optRow(group, channel, label, sub, locked, confirmMsg) {
  const on = locked ? true : !!(optIn()[group] && optIn()[group][channel]);
  // label/sub/confirmMsg are static UI copy (no user data) — safe to inline.
  const handler = locked ? '' : `setOptIn('${group}','${channel}'${confirmMsg?`,'${confirmMsg.replace(/'/g,'’')}'`:''})`;
  return `<button ${locked?'disabled aria-disabled="true"':''} type="button" ${handler?`onclick="${handler}"`:''} class="w-full flex items-center justify-between px-4 py-3.5 border-b border-navy-600 last:border-0 text-left ${locked?'opacity-70 cursor-not-allowed':''}">
    <span class="min-w-0 pr-3"><span class="block text-sm text-white font-medium">${label}</span>${sub?`<span class="block text-[11px] text-slate-300 mt-0.5">${sub}</span>`:''}</span>
    <span class="gf-switch ${locked?'opacity-70':''}" role="switch" aria-checked="${on?'true':'false'}" data-state="${on?'on':'off'}"></span>
  </button>`;
}

        </div>
        ${mine.length ? mine.map(r => {
          const s = statusMap[r.status] || statusMap.pending;
          return `
          <div class="flex items-center justify-between py-2.5 border-b border-navy-600 last:border-0">
            <div class="min-w-0">
              <div class="text-sm font-medium text-white truncate">${r.referee}</div>
              <div class="text-[10px] tracking-wider text-slate-300 uppercase">${r.date}${r.grams?' · '+r.grams+'g':''}</div>
            </div>
            <div class="text-right flex-shrink-0 ml-3">
              <div class="text-sm font-medium ${r.reward?'text-pos':'text-slate-500'}">${r.reward?'+RM '+r.reward:'—'}</div>
              <span class="text-[9px] font-medium px-1.5 py-0.5 rounded-full ${s.cls}">${s.label}</span>
            </div>
          </div>`; }).join('') :
          '<div class="text-center py-6 text-slate-300 text-sm">No referrals yet — share your code above.</div>'
        }
      </div>
    </section>
    <div class="h-6"></div>
  `;
}

function renderTierLadder() {
  const me = GF_DATA.me;
  const order = ['entry','bronze','silver','gold'];
  const curIdx = order.indexOf(me.tier);
  const tierName = me.tier.charAt(0).toUpperCase() + me.tier.slice(1);
  // The ladder is about TIER standing → drive it by STATUS points, not the redeemable pool.
  const tts = (typeof tierStatus === 'function') ? tierStatus(me, GF_DATA.transactions)
    : { status: (me.qualifyingPoints||me.points), nextTier: null, toNext: 0, spendMet: true, maintainNeed: 0 };
  const nextTierName = tts.nextTier ? tts.nextTier.charAt(0).toUpperCase() + tts.nextTier.slice(1) : null;

  // 4-tier ladder marks
  const marks = [
    { key:'entry',  label:'Entry',  pts:'1,000' },
    { key:'bronze', label:'Bronze', pts:'2,500' },
    { key:'silver', label:'Silver', pts:'7,000' },
    { key:'gold',   label:'Gold',   pts:'15,000' }
  ];

  // Chagee-style tier cards (swipeable carousel) — one card per tier with its benefits.
  // Points are earned by gold grade (999 / 916 / others), not by tier — tiers differ by perks.
  const tierCards = [
    { key:'entry',  name:'Entry',  disc:'entry',  threshold:'1,000 pts', hero:'1,000',  heroCap:'welcome points', accent:'#B7C3CC', benefits:[{ic:'gift',t:'Welcome RM 30 voucher · valid 6 months'},{ic:'coin',t:'Earn points on every purchase'},{ic:'cake',t:'Birthday gift'},{ic:'card',t:'Digital membership card'}] },
    { key:'bronze', name:'Bronze', disc:'bronze', threshold:'2,500 pts', hero:'2,500',  heroCap:'to qualify',     accent:'#D2A877', benefits:[{ic:'refresh',t:'Maintain with RM 300 / year'},{ic:'cake',t:'Birthday gift'},{ic:'tag',t:'Seasonal vouchers'},{ic:'coin',t:'100 pts = RM 1 redemption'}] },
    { key:'silver', name:'Silver', disc:'silver', threshold:'7,000 pts', hero:'7,000',  heroCap:'to qualify',     accent:'#CBD2D8', benefits:[{ic:'refresh',t:'Maintain with RM 600 / year'},{ic:'gift',t:'Exclusive vouchers'},{ic:'sparkles',t:'Early access to new pieces'},{ic:'starFill',t:'Priority service'}] },
    { key:'gold',   name:'Gold',   disc:'gold',   threshold:'15,000 pts',hero:'15,000', heroCap:'to qualify',     accent:'#F2C21A', benefits:[{ic:'refresh',t:'Maintain with RM 1,000 / year'},{ic:'starFill',t:'VIP vouchers'},{ic:'clock',t:'7-day early access'},{ic:'sparkles',t:'VIP events'}] }
  ];

  return `
    <header class="pwa-header" style="padding-bottom:20px;">
      <div class="flex items-center justify-between mb-4">
        <button type="button" onclick="goBack()" class="text-slate-300 hover:text-white flex items-center gap-1 text-sm transition">
          <span class="w-5 h-5">${ICONS.chevL}</span><span>${backLabel()}</span>
        </button>
        <span class="text-xs text-slate-300">Tier Status</span>
      </div>
      <div class="text-3xl text-white font-light mb-2">A ladder worth <em class="text-gold-500 not-italic">climbing.</em></div>
      <p class="text-xs text-slate-300 leading-relaxed">Earn points on every Goldfinch purchase. Climb tiers, unlock benefits.</p>
    </header>

    <section class="px-5 mt-2">
      <!-- Current position -->
      <div class="keep-dark rounded-2xl p-5 mb-5 relative overflow-hidden" style="background:#011827;border:1px solid var(--brass)">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div class="text-[10px] tracking-[0.18em] text-gold-500 uppercase font-medium">Status points · keeps your tier</div>
            <div class="display text-5xl text-white mt-1.5">${fmtNum(tts.status)} <span class="text-lg text-slate-300 font-normal">pts</span></div>
            <div class="text-xs text-slate-300 mt-2">${me.topTier ? '<strong class="text-white font-medium">Gold</strong> · top tier · '+(tts.spendMet?'min RM '+fmtNum(tts.maintainNeed)+'/yr kept ✓':'spend RM '+fmtNum(tts.maintainNeed)+'/yr to keep') : fmtNum(tts.toNext)+' status points to <strong class="text-white font-medium">'+(nextTierName||'next')+'</strong>'}</div>
            <!-- gold purchased by grade (mirrors the CRM member detail) -->
            <div class="flex gap-5 mt-3">
              <div><div class="text-[9px] uppercase tracking-wider text-slate-300">999.9 Pure</div><div class="text-sm text-white font-medium">${me.grams999}g</div></div>
              <div><div class="text-[9px] uppercase tracking-wider text-slate-300">916 Gold</div><div class="text-sm text-white font-medium">${me.grams916}g</div></div>
              <div><div class="text-[9px] uppercase tracking-wider text-slate-300">Total</div><div class="text-sm text-gold-500 font-medium">${(me.grams999+me.grams916).toFixed(1)}g</div></div>
            </div>
          </div>
          <div class="tier-medal ${me.tier} flex-shrink-0" style="width:68px;height:68px"><span class="medal-bird">${ICONS.birdLogo}</span></div>
        </div>

        <!-- Ladder · Entry → Bronze → Silver → Gold -->
        <div class="mt-8">
          <div class="relative" style="height:24px;">
            <div class="absolute left-2.5 right-2.5 top-1/2 -translate-y-1/2 h-1 bg-navy-600 rounded-full"></div>
            <div class="absolute left-2.5 top-1/2 -translate-y-1/2 h-1 rounded-full" style="background:var(--gold-grad);width:calc((100% - 20px) * ${me.topTier ? 1 : Math.min(1, tts.status/15000)})"></div>
            <div class="absolute inset-0 flex justify-between items-center">
              ${marks.map((mk,i) => `<div class="tier-dot ${i===curIdx?'current':''}"></div>`).join('')}
            </div>
          </div>
          <div class="flex justify-between mt-3">
            ${marks.map((mk,i) => `
              <div class="${i===0?'text-left':i===marks.length-1?'text-right':'text-center'}">
                <div class="text-[9px] tracking-widest ${i===curIdx?'text-gold-500 font-medium':'text-slate-300'}">${mk.label}</div>
                <div class="text-[10px] ${i===curIdx?'text-slate-300 font-medium':'text-slate-500'}">${mk.pts}</div>
              </div>`).join('')}
          </div>
        </div>
      </div>

      <!-- How tiers work — achieve by points (sticky), keep by a minimum purchase -->
      <div class="rounded-xl p-4 mb-5 bg-navy-800 border border-navy-600">
        <div class="text-[10px] tracking-[0.18em] text-slate-300 uppercase mb-3 font-medium">How your tier works</div>
        <div class="flex items-start gap-3 mb-3">
          <span class="w-7 h-7 rounded-lg bg-gold-500/15 text-gold-500 flex items-center justify-center flex-shrink-0"><span class="w-4 h-4">${ICONS.starFill}</span></span>
          <div><div class="text-sm text-white font-medium">Reach it with status points</div><div class="text-xs text-slate-300 mt-0.5">Earn status points on every purchase. Once you cross a tier, it's yours — <span class="text-white">redeeming points never drops your tier</span>.</div></div>
        </div>
        <div class="flex items-start gap-3">
          <span class="w-7 h-7 rounded-lg bg-gold-500/15 text-gold-500 flex items-center justify-center flex-shrink-0"><span class="w-4 h-4">${ICONS.refresh}</span></span>
          <div><div class="text-sm text-white font-medium">Keep it with a minimum purchase</div><div class="text-xs text-slate-300 mt-0.5">Make at least the minimum purchase each 12 months to renew — <span class="text-white">Bronze RM 300 · Silver RM 600 · Gold RM 1,000</span>.</div></div>
        </div>
      </div>

      <!-- Recent earnings -->
      <div class="rounded-xl p-4 mb-5 bg-navy-800 border border-navy-600">
        <div class="text-[10px] tracking-[0.18em] text-slate-300 uppercase mb-3 font-medium">Recent Earnings</div>
        ${GF_DATA.activity.map(a => `
          <div class="flex items-center justify-between py-2.5 border-b border-navy-600 last:border-0">
            <div>
              <div class="text-sm font-medium text-white">${a.label}</div>
              <div class="text-[10px] tracking-wider text-slate-300 uppercase">${a.date}${a.meta?' · '+a.meta:''}</div>
            </div>
            <div class="text-sm font-medium ${a.points >= 0 ? 'text-pos' : 'text-neg'}">${a.points >= 0 ? '+' : ''}${a.points}</div>
          </div>`).join('')}
      </div>
    </section>

    <!-- Benefits per tier — Chagee-style swipeable carousel (replaces the comparison table) -->
    <div class="mb-2">
      <div class="px-5 mb-3 flex items-center justify-between">
        <div class="text-[10px] tracking-[0.18em] text-slate-300 uppercase font-medium">Benefits By Tier</div>
        <span class="text-[10px] text-slate-500 inline-flex items-center gap-1">Swipe <span class="w-3 h-3">${ICONS.chevR}</span></span>
      </div>
      <div class="tier-carousel">
        ${tierCards.map(tc => {
          const isCur = tc.key === me.tier;
          return `
          <div class="tier-card loyalty-card keep-dark ${tc.disc} ${isCur?'is-current':''}">
            <div class="tier-card-sheen"></div>
            <div class="lc-accent"></div>
            <div class="relative flex items-center justify-between mb-4">
              <div>
                <div class="text-[11px] tracking-[0.18em] uppercase font-medium ${tc.key==='gold'?'text-gold-lux':''}" style="${tc.key==='gold'?'':'color:'+tc.accent}">${tc.name}${isCur?' · You':''}</div>
                <div class="text-xs text-slate-300 mt-0.5">From ${tc.threshold}</div>
              </div>
              <div class="tier-medal ${tc.disc} flex-shrink-0" style="width:56px;height:56px"><span class="medal-bird">${ICONS.birdLogo}</span></div>
            </div>
            <div class="relative flex items-baseline gap-1.5 mb-4 pb-4 border-b border-white/10">
              <span class="display text-5xl text-white">${tc.hero}</span>
              <span class="text-xs text-slate-300">${tc.heroCap}</span>
            </div>
            <div class="relative space-y-2.5">
              ${tc.benefits.map(b => `
                <div class="flex items-center gap-3 rounded-xl px-3 py-2.5 bg-white/5 border border-white/10">
                  <span class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style="background:rgba(255,255,255,0.07);color:${tc.accent}"><span class="w-[18px] h-[18px]">${ICONS[b.ic]||ICONS.check}</span></span>
                  <span class="text-xs text-white font-medium leading-snug">${b.t}</span>
                </div>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="carousel-dots">${tierCards.map((tc,i) => `<span class="cd ${i===curIdx?'on':''}"></span>`).join('')}</div>
    </div>
    <div class="h-8"></div>
  `;
}

/* Boot */
route();
</script>
