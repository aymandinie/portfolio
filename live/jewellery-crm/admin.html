<style>
  /* §7.5 Keyboard focus ring — inlined so it applies even before the external
     sheet resolves, and is introspectable (styles.css is an opaque file:// origin). */
  :focus-visible { outline: 2px solid var(--focus, #F2C21A); outline-offset: 2px; border-radius: 3px; }
  a:focus-visible, button:focus-visible, [role="button"]:focus-visible,
  select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--focus, #F2C21A); outline-offset: 2px;
  }
  :focus:not(:focus-visible) { outline: none; }
</style>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        navy:{950:'#011827',900:'#022135',800:'#0A3A57',700:'#114A66',600:'#23536E'},
        gold:{300:'#FDE08A',400:'#FBD33A',500:'#F2C21A',600:'#E0B200',700:'#B98F00'},
        brass:'#BFA46F',
        taupe:{100:'#EFE9E2',300:'#D7C9BC',500:'#7E97AA',700:'#8A7B6B'},
        cream:{50:'#FBF6EE',100:'#F3E9DA',200:'#ECDCC8',DEFAULT:'#ECDCC8'},
        slate:{300:'#7E97AA',500:'#4E6D80'}
      },
      fontFamily:{ serif:['Inter','sans-serif'], sans:['Inter','-apple-system','sans-serif'] }
    }}
  }

<!-- Main content -->
<div id="mainPane" class="md:ml-64 min-h-screen flex flex-col transition-all duration-300">

  <!-- Top header -->

        <svg class="w-5 h-5 flex-shrink-0 text-gold-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>

<script src="assets/components.js"></script>
<script>
/* SPEC §3.5 / Q4 — the CRM roles live in exactly ONE string literal, here.
   components.js (PERMISSIONS/ROLES/can) and every role list read from it; no
   role name is re-quoted anywhere else. */
window.GF_ROLES = ['HQ Admin', 'Store Manager', 'Cashier'];

/* ============================================================
   NAV
   ============================================================ */
const NAV = [
  { id:'myoutlet',   label:'My Outlet',       icon:'building', match:'outlet' },  // scoped roles only
  { id:'dashboard',  label:'Dashboard',       icon:'dashboard' },
  { id:'customers',  label:'Membership',      icon:'users', children:[
    { sub:'list',     label:'All Members',        icon:'users' },
    { sub:'tiers',    label:'Tiers & Earn Rules', icon:'star' },
    { sub:'vouchers', label:'Vouchers',           icon:'gift', cap:'view' },
    { sub:'referrals',label:'Referrals',          icon:'refer' }
  ]},
  { id:'atome',      label:'Installments',    icon:'card', children:[
    { sub:'overview', label:'Combined',         icon:'layers' },
    { sub:'atome',    label:'Atome',            icon:'card' },
    { sub:'shopee',   label:'Shopee PayLater',  icon:'card' },
    { sub:'grab',     label:'GrabPayLater',     icon:'card' },
    { sub:'others',   label:'Others',           icon:'card' }
  ]},
  { id:'broadcasts', label:'Broadcasts',      icon:'broadcast', children:[
    { sub:'templates',   label:'Templates',   icon:'broadcast' },
    { sub:'triggers',    label:'Automated Triggers', icon:'bolt' },
    { sub:'drafts',      label:'Drafts',      icon:'pencil' },
    { sub:'history',     label:'History',     icon:'clock' },
    { sub:'performance', label:'Performance', icon:'chart' }
  ]},
  { id:'reports',    label:'Sales & Reports', icon:'chart', children:[
    { sub:'overview', label:'Overview',      icon:'chart' },
    { sub:'invoices', label:'Sales records', icon:'receipt' }
  ]},
  { id:'settings',   label:'Settings',        icon:'settings', children:[
    { sub:'company',       label:'Company',        icon:'building' },
    { sub:'team',          label:'Team',           icon:'users' },
    { sub:'integrations',  label:'Integrations',   icon:'globe' }
  ]}
];

// Section IDs the user has manually expanded (independent of the active route).
const NAV_OPEN = new Set();

function toggleNavGroup(id) {
  if (NAV_OPEN.has(id)) NAV_OPEN.delete(id); else NAV_OPEN.add(id);
  renderNav();
}

function renderNav() {
  // Match by section (everything before the first '/'), so sub-tabs keep the parent highlighted
  const hashParts = location.hash.replace('#','').split('/');
  const currentSection = hashParts[0] || 'dashboard';
  const currentSub     = hashParts[1] || '';
  // Roles matrix (components.js PERMISSIONS) enforced in the nav: no capability ⇒
  // the whole nav item disappears (not a greyed button). Store Manager & Cashier get
  // view/create/upload only → no Broadcasts, no Settings.
  const navCap = { dashboard: 'dashboard', broadcasts: 'broadcast', reports: 'reports', settings: 'settings' };
  const capOk = c => !c || (typeof can==='function' && can(c));
  // "My Outlet" is the outlet-scoped roles' home hub (own store's customers/sales/plans);
  // hidden for HQ Admin, who has the network-wide sections instead.
  const scopedNow = typeof isOutletScoped==='function' && isOutletScoped();
  const visibleNav = NAV.filter(n => {
    if (n.id==='myoutlet') return scopedNow;                              // scoped roles' hub
    if (scopedNow && (n.id==='dashboard' || n.id==='reports')) return false; // network views → HQ only; scoped roles use My Outlet
    return capOk(navCap[n.id]);
  });
  document.getElementById('navItems').innerHTML = visibleNav.map(n => {
    const isActive = (n.match || n.id) === currentSection;
    const href = n.id==='myoutlet' ? '#outlet/'+(sessionOutletCode()||'') : '#'+n.id;
    // Auto-expand the section that holds the current page; respect manual toggles otherwise.
    const isOpen = n.children && (isActive || NAV_OPEN.has(n.id));
    const chevron = n.children
      ? `<button type="button" class="nav-chevron" onclick="event.preventDefault();event.stopPropagation();toggleNavGroup('${n.id}')" aria-label="Toggle ${n.label}">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${isOpen?90:0}deg);transition:transform 0.15s;"><polyline points="9 18 15 12 9 6"/></svg>
         </button>`
      : '';
    const main = `<a href="${href}" class="nav-item ${isActive?'active':''} ${n.children?'has-children':''}" onclick="closeMobileSidebar()">${ICONS[n.icon]}<span class="nav-label">${n.label}</span>${chevron}</a>`;
    if (!n.children || !isOpen) return main;
    const sub = n.children.filter(c => capOk(c.cap)).map(c => {
      const subActive = isActive && (currentSub === c.sub || (!currentSub && c.sub === n.children[0].sub));
      return `<a href="#${n.id}/${c.sub}" class="nav-subitem ${subActive?'active':''}" onclick="closeMobileSidebar()">${c.icon?`<span class="nav-subicon">${ICONS[c.icon]||''}</span>`:''}<span class="nav-sublabel">${c.label}</span></a>`;
    }).join('');
    return main + `<div class="nav-subgroup">${sub}</div>`;
  }).join('');
  // renderNav is also called on its own (sign-in, group toggle) — re-localise for cashier here too.
  if (typeof syncCrmLang === 'function') syncCrmLang();
  if (typeof localizeDOM === 'function') { const s = document.getElementById('sidebar'); if (s) localizeDOM(s); }
}

function toggleSidebar() {
  const s = document.getElementById('sidebar');
  const o = document.getElementById('sidebarOverlay');
  s.classList.toggle('-translate-x-full');
  s.classList.toggle('translate-x-0');
  o.classList.toggle('show');
}
function closeMobileSidebar() {
  if (window.innerWidth < 768) toggleSidebar();
}

/* Collapse the sidebar to icons-only (power-user mode, Linear/Stripe-style) */
function toggleCollapse() {
  const s = document.getElementById('sidebar');
  const m = document.getElementById('mainPane');
  const collapsed = s.classList.toggle('sidebar-collapsed');
  s.classList.toggle('w-64', !collapsed);
  s.classList.toggle('w-16', collapsed);
  m.classList.toggle('md:ml-64', !collapsed);
  m.classList.toggle('md:ml-16', collapsed);
  if (typeof GFP !== 'undefined') GFP.set('collapsed', collapsed);
}

/* ============================================================
   ROUTER
   ============================================================ */
const RENDERERS = {};
const POSTRENDER = {};

// Small real client-side filter for card/row lists (status pickers on Vouchers /
// Referrals) — hides non-matching rows; "All …" shows everything.
function setVoucherState(code, val){ if(typeof can==='function' && !can('issueVoucher')){ toast('Changing voucher status is restricted to HQ Admin','warn'); return; } const v=(GF_DATA.vouchers||[]).find(x=>x.code===code); if(v) v.mgmtStatus=val; toast('Voucher '+code+' set to '+val,'success'); }
// Voucher-pool status filter — matches a per-row data-vstatus (NOT textContent, since the HQ
// status <select> would otherwise leak every option label into the row text and defeat the filter).
function filterVoucherRows(val) {
  const v = (val || 'all').toLowerCase();
  document.querySelectorAll('tr.voucherRow').forEach(r => {
    const s = (r.getAttribute('data-vstatus') || '').toLowerCase();
    r.style.display = (v.startsWith('all') || s === v) ? '' : 'none';
  });
}
function filterListByText(sel, rowClass) {
  const v = (sel.value || '').toLowerCase();
  document.querySelectorAll('.' + rowClass).forEach(r => {
    const t = r.textContent.toLowerCase();
    r.style.display = (v.startsWith('all') || t.includes(v)) ? '' : 'none';
  });
}

// First route the current role may actually open — used as the safe landing/bounce
// target so a Cashier (no Dashboard) never hits a redirect loop.
function roleHome() {
  // Outlet-scoped roles land on their own outlet hub (customers + sales + plans in one page).
  if (typeof isOutletScoped==='function' && isOutletScoped()) { const c = sessionOutletCode(); if (c) return 'outlet/' + c; }
  const navCap = { dashboard:'dashboard', broadcasts:'broadcast', reports:'reports', settings:'settings' };
  const ok = c => !c || (typeof can==='function' && can(c));
  for (const n of NAV) {
    if (n.id === 'myoutlet') continue;   // resolved above (scoped only) — never a home otherwise
    if (!ok(navCap[n.id])) continue;
    if (n.children) { const c = n.children.find(c => ok(c.cap)); if (c) return n.id + '/' + c.sub; }
    else return n.id;
  }
  return 'customers/list';
}

// Mount every DateRange placeholder inside `root`. Called both on full route render and
// on partial re-renders (e.g. Reports) so the segmented strip never disappears after a
// click. Restores a persisted custom range from data-custom-from/to so its label sticks.
function mountDateRanges(root) {
  if (!root) return;
  root.querySelectorAll('[data-daterange]').forEach(el => {
    const cb = el.getAttribute('data-onchange');
    const cf = el.getAttribute('data-custom-from'), ct = el.getAttribute('data-custom-to');
    DateRange.create({
      mount: el, value: el.getAttribute('data-value') || '30d', compare: el.hasAttribute('data-compare'),
      custom: (cf || ct) ? { from: cf || '', to: ct || '' } : null,
      onChange: (cb && typeof window[cb] === 'function') ? inst => window[cb](inst) : undefined
    });
  });
}

function route() {
  // Resolve the interface language FIRST — before any guard/toast can fire — so a boot-time
  // bounce (e.g. cashier landing on #dashboard) is already localised.
  syncCrmLang();
  let hash = location.hash.replace('#','');
  let [section, sub] = hash.split('/');
  if (!section) section = 'dashboard';
  // Deep-linking a capability the role lacks bounces to the role's home (roles matrix).
  // Most guards check one capability; invoice/plan/outlet record pages use canViewRecords()
  // so an outlet-scoped Cashier can open their OWN outlet's documents (data scoped in-page).
  const guardOf = () => {
    if (section === 'customers' && sub === 'vouchers') return { check:()=>can('view'), label:'Vouchers' };
    const capMap = { dashboard:['dashboard','Dashboard'], reports:['reports','Sales & Reports'], broadcasts:['broadcast','Broadcasts'], settings:['settings','Settings'] };
    if (capMap[section]) return { check:()=>can(capMap[section][0]), label:capMap[section][1] };
    if (section === 'invoice') return { check:canViewRecords, label:'Invoice' };
    if (section === 'plan')    return { check:canViewRecords, label:'Plan' };
    if (section === 'outlet')  return { check:canViewRecords, label:'Outlet' };
    if (section === 'design')  return { check:canViewRecords, label:'Design code' };
    return null;
  };
  const g = guardOf();
  if (g && !(typeof g.check==='function' && g.check())) {
    const home = roleHome();
    // Only toast when the user actively navigated somewhere blocked (not the initial land).
    if (section + (sub?'/'+sub:'') !== home) toast(g.label + ' is restricted for your role', 'warn');
    location.hash = home; return;
  }
  renderNav();
  const renderer = RENDERERS[section];
  if (renderer) {
    const pc = document.getElementById('pageContent');
    pc.innerHTML = renderer(sub);
    if (POSTRENDER[section]) POSTRENDER[section](sub);
    // Auto-mount the one period control anywhere a placeholder is dropped.
    mountDateRanges(pc);
    window.scrollTo(0,0);
    // BM is the CASHIER interface language — the counter staff work entirely in Malay,
    // while HQ Admin / Store Manager stay in English. Language is derived from the role
    // (never a manual toggle), refreshed on every route so it can't drift.
    syncCrmLang();
    localizeCrmChrome();
    if (typeof localizeDOM === 'function') localizeDOM(pc);
  }
}
// True only for the Cashier role (GF_ROLES[2]) — the one outlet-counter role that can run in BM.
function isCashier() {
  const R = window.GF_ROLES || [];
  return typeof SESSION !== 'undefined' && SESSION.role === R[2];
}
// Language policy: HQ Admin / Store Manager are ALWAYS English (forced — never leaks BM even if a
// BM preference is left in localStorage from a cashier session). The Cashier gets an EN/BM switch;
// their choice is remembered (gf_lang), defaulting to BM. This runs on every route so it can't drift.
function syncCrmLang() {
  if (!isCashier()) { window.GF_LANG = 'en'; return; }
  let stored = null; try { stored = localStorage.getItem('gf_lang'); } catch (e) {}
  window.GF_LANG = (stored === 'en') ? 'en' : 'ms';   // cashier defaults to BM
}
// The cashier's EN/BM switch. gfSetLang persists the choice; re-rendering re-localises everything.
function setCrmLang(l) {
  if (typeof gfSetLang === 'function') gfSetLang(l);
  renderNav();
  route();
  if (typeof toast === 'function') toast(l === 'ms' ? 'Ditukar ke Bahasa Melayu' : 'Switched to English', 'success');
}
// Localise the persistent CRM shell (side nav + topbar) — these live outside pageContent — and
// show the EN/BM switch (cashier only), highlighting the active language.
function localizeCrmChrome() {

/* Unified pager — stable, established-site style. Shows every page when few (no
   jumping ellipsis); a fixed first/window/last layout only for large sets.
   navFn is a function name called as navFn(pageIndex). page is 0-indexed. */
/* §3.2 Pager is now the single component in assets/components.js (window.Pager,
   aliased to window.pager). The old dual-mode pager() and the void0() no-op are
   deleted — every consumer routes through the one fixed-slot component. */
/* Pad a rendered set of <tr> up to `size` with blank spacer rows so a table's
   height stays constant across pages (polished, no layout jump). Preserved. */
function padRows(html, count, size, colspan) {
  let out = html;
  for (let i = count; i < size; i++) out += `<tr class="pad-row"><td colspan="${colspan}">&nbsp;</td></tr>`;
  return out;
}

function pageTabs(tabs, current, basePath) {
  return `
    <div class="mb-5">
      <div class="inline-flex gap-2 overflow-x-auto max-w-full">
        ${tabs.map(([id, label]) => {
          const active = id === current;
          // §7.3 — segmented control: ONE active idiom (navy fill). No border-2,
          // no shadow, no gold dot. Fill is the single encoding of "active".
          return `
            <a href="#${basePath}/${id}" class="px-5 py-2.5 text-sm md:text-base font-medium whitespace-nowrap rounded-lg border transition-colors ${active ? 'bg-navy-950 text-white border-navy-950' : 'bg-white text-navy-950 border-gray-200 hover:border-navy-950'}">${label}</a>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function kpiCard({label, value, delta, trend, deltaClass, sub = '', icon = ''}) {
  // Delta direction: explicit `trend` ('up'|'down'|'flat') wins; else inferred from a
  // leading minus in `delta`. Arrow + colour follow the sign — no more always-green ▲.
  let dir = trend;
  if (!dir && delta != null) dir = /(^|\s)[-−]|▼|↓|\bdown\b/i.test(String(delta)) ? 'down' : 'up';
  const arrow = dir === 'down' ? '▼' : dir === 'flat' ? '→' : '▲';
  const cls = deltaClass || (dir === 'down' ? 'text-neg' : dir === 'flat' ? 'text-gray-500' : 'text-pos');
  return `
    <div class="card flex flex-col">
      <div class="flex items-start justify-between gap-2 mb-2">
        <div class="text-[11px] tracking-widest text-gray-500 uppercase font-medium">${label}</div>
        ${icon ? `<span class="w-7 h-7 rounded-lg bg-cream-50 border border-cream-200 flex items-center justify-center text-gold-700 flex-shrink-0"><span class="w-4 h-4">${ICONS[icon]||''}</span></span>` : ''}
      </div>
      <div class="serif text-2xl sm:text-3xl md:text-4xl text-navy-950 font-medium leading-none whitespace-nowrap">${value}</div>
      <div class="mt-auto pt-3">
        ${delta ? `<div class="text-sm ${cls} flex items-center gap-1 font-medium">${arrow} ${delta}</div>` : ''}
        ${sub ? `<div class="text-sm text-gray-600 font-medium">${sub}</div>` : ''}
      </div>
    </div>`;
}

// Single source of truth for every "recent campaigns" surface (Dashboard cards + detail modal +
// Performance tab). Derives from the REAL reconciled broadcasts — never the stale seed — so
// recipient counts match History/Drafts everywhere. Most-recent Sent first, normalised shape.
const _BC_MON = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
function _bcDateKey(d) { const m=/(\d{1,2})\s+(\w{3})\s+(\d{4})/.exec(d||''); return m ? (+m[3])*10000+(_BC_MON[m[2]]||0)*100+(+m[1]) : 0; }
function _bcChans(b) { return b.channel && b.channel.includes('SMS') ? ['whatsapp','sms'] : ['whatsapp']; }
function recentBroadcasts(n) {
  const out = (GF_DATA.broadcasts || [])
    .filter(b => b.status === 'Sent')
    .slice().sort((a,b) => _bcDateKey(b.date) - _bcDateKey(a.date))
    .map(b => ({
      name: b.name, sent: (b.date || '').split(' · ')[0], channel: b.channel, audience: b.audience,
      recipients: b.recipients, delivered: b.delivered, deliveredSingleTick: b.deliveredSingleTick,
      redeem: b.redeem, status: /reminder|installment/i.test(b.name) ? 'auto' : 'sent'
    }));
  return n ? out.slice(0, n) : out;
}
// Real monthly aggregates over Sent broadcasts — feeds the History + Performance trend charts
// at true boutique scale (no fabricated 12-week volume).
function bcMonthlyStats() {
  const by = {};
  (GF_DATA.broadcasts || []).filter(b => b.status === 'Sent').forEach(b => {
    const m = /(\d{1,2})\s+(\w{3})\s+(\d{4})/.exec(b.date||''); if (!m) return;
    const key = m[2]+' '+m[3];
    const o = by[key] || (by[key] = { k:(+m[3])*100+(_BC_MON[m[2]]||0), label:m[2], count:0, recipients:0, cost:0, wdel:0 });
    o.count++; o.recipients += b.recipients;
    o.cost += _bcChans(b).reduce((s,c) => s + b.recipients*(BROADCAST_RATE[c]||0), 0);
    o.wdel += b.recipients*(b.delivered||0);
  });
  return Object.values(by).sort((a,b) => a.k - b.k).map(o => ({ ...o, delivered: o.recipients ? o.wdel/o.recipients : 0 }));
}

/* Dashboard — interactive product-category card (tap a category to switch its 12-week trend) */
// F3 — Sales by Category (a jeweller wants sales, not member headcount).
let DASH_CAT = 'Cincin';
let DASH_SALES_SORT = 'revenue';   // revenue | units | avg | wow
let DASH_RANGE = '30d';            // MASTER dashboard window — governs KPIs, Snapshot, Category, Growth
let DASH_CUSTOM_DAYS = null;       // day-span when DASH_RANGE==='custom'
let DASH_CUSTOM = null;            // {from,to} ISO — restores the picker on full re-render
const DASH_DAYS = { '7d':7, '30d':30, '60d':60, '90d':90 };
function dashRangeDays() { return DASH_RANGE === 'custom' ? (DASH_CUSTOM_DAYS || 30) : (DASH_DAYS[DASH_RANGE] || 30); }
function dashRangeLabel() { return DASH_RANGE === 'custom' ? (DASH_CUSTOM_DAYS||30)+'-day' : DASH_RANGE; }
function dashRangeShort() { return DASH_RANGE === 'custom' ? dashRangeDays()+'d' : DASH_RANGE; }
// Compact RM for windowed KPI values (RM 2.39M / RM 558K).
function rmCompact(n){ n = Math.round(n); if (n >= 1e6) return 'RM ' + (n/1e6).toFixed(2) + 'M'; if (n >= 1e3) return 'RM ' + Math.round(n/1e3) + 'K'; return fmtRM(n); }
function salesByCategory() {
  const f = dashRangeDays() / 30;   // seed figures are a 30-day window; scale to selection
  const arr = GF_DATA.categoryTrend.map(c => {
    const p = GF_DATA.productCategories.find(x=>x.key===c.key) || {};
    const revenue = Math.round((c.revenue||0) * f), units = Math.round((c.units||0) * f);
    return { key:c.key, label:p.label||c.key, color:p.color, revenue,
             units, avg:units?Math.round(revenue/units):0, wow:c.wow||0 };
  });
  const s = DASH_SALES_SORT;
  return arr.sort((a,b)=> s==='wow' ? b.wow-a.wow : b[s]-a[s]);
}
function setDashRange(inst){
  if (!inst) return;
  DASH_RANGE = inst.value;
  if (inst.value === 'custom' && inst.custom && inst.custom.from && inst.custom.to) {
    DASH_CUSTOM = inst.custom;
    DASH_CUSTOM_DAYS = Math.max(1, Math.round((new Date(inst.custom.to) - new Date(inst.custom.from)) / 864e5));
  } else if (inst.value !== 'custom') { DASH_CUSTOM_DAYS = null; DASH_CUSTOM = null; }
  renderDashboardBody();
}
// Master range governs the whole board → re-render the dashboard, scroll-safe.

  const el = document.getElementById('pageContent');
  if (!el) return;
  const y = window.scrollY || document.documentElement.scrollTop || 0;

  mountDateRanges(el);

}
// Member Growth windowed to the master range — net adds scale with the days;
// the trend shows a trailing slice of the monthly series.
function dashGrowthModel(){
  const days = dashRangeDays();
  const totalNow = GF_DATA.kpis.totalMembers;
  const g = GF_DATA.growthByMonth;
  const perDay = (totalNow - g[0].v) / 365;
  const added = Math.max(0, Math.round(perDay * days));
  const months = Math.min(g.length, Math.max(2, Math.round(days/30) + 1));
  return { days, added, start: totalNow - added, now: totalNow, pts: g.slice(g.length - months) };
}

// ── Single demo "today" anchor + one ledger-window aggregator ──────────────────────────────
// Every ledger-derived figure (Dashboard KPIs, Sales Snapshot, Sales & Reports) keys off THIS,
// reading GF_DATA.transactions, so the Dashboard and Reports can never disagree for a given
// window. The ledger carries some post-dated rows; anchoring to 15 May keeps "as of today" honest.
const DEMO_TODAY_ISO = '2026-05-15';
// Human date label for the demo clock — derived so the weekday/date never drift or contradict
// the pin (15 May 2026 is a Friday). long=true → "Friday · 15 May 2026", else "Fri · 15 May 2026".
function demoDateLabel(long){
  const d = new Date((typeof DEMO_TODAY_ISO!=='undefined'?DEMO_TODAY_ISO:'2026-05-15') + 'T12:00:00');
  const dw = long ? ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return dw[d.getDay()] + ' · ' + d.getDate() + ' ' + mo[d.getMonth()] + ' ' + d.getFullYear();
}
function _dayISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function ledgerWindowAgg(days, endISO) {
  const end = new Date((endISO || DEMO_TODAY_ISO) + 'T23:59:59');
  const from = new Date(end); from.setDate(from.getDate() - days);
  const win = (GF_DATA.transactions || []).filter(t => { if (t.reversed) return false; const x = new Date(t.ts); return x > from && x <= end; });
  const rev = Math.round(win.reduce((s, t) => s + (t.netPaid || 0), 0));
  const grams = Math.round(win.reduce((s, t) => s + (t.lines || []).reduce((a, l) => a + (l.grams || 0), 0), 0));
  const units = win.reduce((s, t) => s + (t.lines || []).length, 0);
  return { txn: win.length, rev, grams, units, avg: win.length ? Math.round(rev / win.length) : 0, txns: win };
}

// Sales Snapshot — reads the SAME transaction ledger as Sales & Reports (no separate seed), so
// TXN / avg / units / revenue reconcile. The graph shows the EXACT selected window: 1 bar for
// Yesterday/Today, 7 bars for the trailing Week — it follows this toggle, NOT the master range.
let DASH_SNAP = 'yesterday';    // 'yesterday' | 'today' | 'week'
function dashSnapshotModel() {
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const today = new Date(DEMO_TODAY_ISO + 'T00:00:00');
  const lab = d => `${d.getDate()} ${MON[d.getMonth()]}`;
  // The chart is ALWAYS the last 7 days as a line; the toggle highlights the selected day and
  // drives the headline stats. A one-day view is a marked point on the trend, not a lone bar.
  const week = []; for (let i = 6; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); const a = ledgerWindowAgg(1, _dayISO(d)); week.push({ d, rev: a.rev, txn: a.txn, units: a.units, lab: lab(d) }); }
  let periodDays, markIndex;
  if (DASH_SNAP === 'week') { periodDays = week.map(x => x.d); markIndex = 6; }
  else if (DASH_SNAP === 'today') { periodDays = [today]; markIndex = 6; }
  else { const y = new Date(today); y.setDate(y.getDate() - 1); periodDays = [y]; markIndex = 5; }   // yesterday
  const rev = periodDays.reduce((s, d) => s + ledgerWindowAgg(1, _dayISO(d)).rev, 0);
  const txn = periodDays.reduce((s, d) => s + ledgerWindowAgg(1, _dayISO(d)).txn, 0);
  const units = periodDays.reduce((s, d) => s + ledgerWindowAgg(1, _dayISO(d)).units, 0);
  const span = periodDays.length, prevEnd = new Date(periodDays[0]); prevEnd.setDate(prevEnd.getDate() - 1);
  const prev = ledgerWindowAgg(span, _dayISO(prevEnd));
  const delta = prev.rev ? Math.round((rev - prev.rev) / prev.rev * 1000) / 10 : null;
  return {
    mode: DASH_SNAP,
    periodLabel: DASH_SNAP === 'week' ? `${lab(week[0].d)} – ${lab(week[6].d)}` : lab(periodDays[0]),
    prevLabel: DASH_SNAP === 'week' ? 'prev 7 days' : lab(prevEnd),
    revenue: rev, delta, txn, units, avg: txn ? Math.round(rev / txn) : 0, series: week, markIndex
  };
}

  const lines = PURCHASE_DRAFT.items.map(it => ({

    workmanship: +it.workmanship||0, lineTotal: purchaseLineTotal(it)

// One voucher per transaction. The discount applies to the voucher-eligible base
// (gold value + other charges; NOT workmanship/upah per §2.3) and is deducted from the
// bill BEFORE it is split into an Atome/BNPL plan — so vouchers apply to installments too.
function purchaseVoucherDiscount() {
  const sel = PURCHASE_DRAFT.voucher;
  if (!sel || sel === 'None') return 0;
  const code = sel.split('·').pop().trim();
  const v = (GF_DATA.vouchers || []).find(x => x.code === code) || (GF_DATA.vouchers || []).find(x => sel.startsWith(x.title));
  if (!v) return 0;
  const base = PURCHASE_DRAFT.items.reduce((s,it) => s + (+it.goldValue||0) + (+it.otherCharges||0), 0);
  const rm = (v.title||'').match(/RM\s?(\d[\d,]*)/), pct = (v.title||'').match(/(\d+)%/);
  let disc = 0;
  if (rm) disc = +rm[1].replace(/,/g,'');
  else if (pct) disc = base * (+pct[1] / 100);   // points vouchers give no cash discount
  return Math.min(Math.round(disc*100)/100, base);

function providerTerms(name){ return PROVIDER_TERMS[name] || [3, 6, 12]; }
function termLabel(mo){ return mo === 1 ? '1 month · pay next month' : mo + ' months'; }
function updatePurchaseProvider(v) {
  PURCHASE_DRAFT.provider = v;
  // Snap the plan length to one this provider actually offers (avoid a "3 months" that Aeon/Grab don't do).
  const terms = providerTerms(v);
  if (!terms.map(String).includes(String(PURCHASE_DRAFT.months))) PURCHASE_DRAFT.months = terms.find(t => t >= 3) || terms[0];

}

function savePurchase() {
  const { total, points, walkin } = purchaseTotals();
  const hasItems = PURCHASE_DRAFT.items.some(it => purchaseLineTotal(it) > 0);
  if (!hasItems) { toast('Add at least one item with a line total first', 'warn'); return; }
  const ts = PURCHASE_DRAFT.saleDate || new Date().toISOString().slice(0,16);
  const enteredAt = new Date().toISOString().slice(0,16);

  if (walkin) {
    toast('Walk-in sale recorded · '+fmtRM(total)+' · counts toward revenue, no points/tier', 'success');
    closePurchaseModal();
    return;
  }

  let m;
  if (PURCHASE_DRAFT.mode === 'enrol') {
    const e = PURCHASE_DRAFT.enrol;
    if (!e.name || !e.phone) { toast('Enter at least a name and phone to enrol', 'warn'); return; }
    if (!e.pdpaSigned) { toast('Confirm the PDPA consent form was signed at the counter before enrolling', 'warn'); return; }
    const id = 'GF-2026-' + String(90000 + Math.floor((GF_DATA.members.length*7+1))).padStart(7,'0');
    const enrolOutlet = (typeof isOutletScoped==='function' && isOutletScoped() && SESSION.outlet) ? SESSION.outlet : 'Kuala Ketil';
    m = { id, name:e.name, phone:e.phone, ic:e.ic||'—', tier:'entry', points:1000, pointsBalance:1000,
      qualifyingPoints:1000, spendYTD:0, outlet:enrolOutlet, topCategory:'Cincin', lastPurchase:'Today',
      dob:'', pdpaSignedOn: enteredAt, optIn:{ marketing:{whatsapp:e.optWhatsapp, sms:e.optSms}, reminders:{whatsapp:true, sms:false},
        consentLog:[ {channel:'pdpa.consent', value:true, ts:enteredAt, source:'counter-signed'},
                     {channel:'marketing.whatsapp', value:!!e.optWhatsapp, ts:enteredAt, source:'new-purchase-enrol'},
                     {channel:'marketing.sms', value:!!e.optSms, ts:enteredAt, source:'new-purchase-enrol'} ] } };
    GF_DATA.members.unshift(m);
    PURCHASE_DRAFT.memberId = id;
    toast('Enrolled '+e.name+' at Entry · welcome grant 1,000 pts + RM30 voucher', 'success');
  } else {
    m = GF_DATA.members.find(x => x.id === PURCHASE_DRAFT.memberId);
  }

  if (m) {
    m.points += points;
    if (m.pointsBalance != null) m.pointsBalance += points;
    if (m.qualifyingPoints != null) m.qualifyingPoints += points;
    m.spendYTD = (m.spendYTD||0) + total;
    m.lastPurchase = 'Today';
    if (typeof applyPromotion === 'function') applyPromotion(m);
  }
  // Voucher lifecycle — a voucher applied to a completed sale is consumed: mark it 'used' (this is
  // what the POS/backend does on scan). Points-bonus vouchers (200 pts etc.) are not consumables.
  if (PURCHASE_DRAFT.voucher && PURCHASE_DRAFT.voucher !== 'None') {
    const usedCode = PURCHASE_DRAFT.voucher.split('·').pop().trim();
    const uv = (GF_DATA.vouchers || []).find(x => x.code === usedCode);
    if (uv && uv.status === 'active' && !/point/i.test(uv.title)) { uv.status = 'used'; uv.usedOn = formatDateTime(ts); }
  }
  toast('Sale saved · '+fmtRM(total)+' · +'+fmtNum(points)+' pts to '+(m?m.name:'member')+' · keyed '+formatDateTime(ts), 'success');
  closePurchaseModal();
  setTimeout(()=>{ if (m) location.hash = 'customers/' + m.id; }, 400);
}

function openPurchaseModal() {
  // §1.5.3 — default the sale date/time to the app's demo "today" (15 May 2026), NOT the real
  // system clock — so a keyed sale sits on the same timeline as every dated figure in the CRM.

// ---- Chart toolkit (fluid: SVG plot fills the tile width via preserveAspectRatio=none; axis labels are HTML so text never distorts) ----
function fmtAxis(v) {
  const a = Math.abs(v);
  if (a >= 1000000) return (v/1000000).toFixed(1)+'M';
  if (a >= 1000) return (v/1000).toFixed(v%1000===0?0:1)+'k';
  if (a >= 100) return Math.round(v).toString();
  return (Math.round(v*10)/10).toString();
}
// Round a raw maximum up to a "nice" value so axis ticks land on clean increments
function niceCeil(v) {
  if (v <= 0) return 1;
  const exp = Math.floor(Math.log10(v));
  const base = Math.pow(10, exp);
  const f = v / base;
  const nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return nf * base;
}
function chartYLabels(min, max) {
  let s=''; for (let t=0;t<=4;t++){ const v=max-(max-min)*t/4; s+=`<div style="line-height:1">${fmtAxis(v)}</div>`; }
  return `<div style="position:absolute;left:0;top:0;bottom:18px;width:30px;display:flex;flex-direction:column;justify-content:space-between;text-align:right;font-size:9px;color:#6B7480;font-weight:600;font-family:Inter,sans-serif">${s}</div>`;
}
// Small unit caption shown top-left of a chart so the axis numbers are never ambiguous
function chartUnit(unit) {
  return unit ? `<div style="position:absolute;left:0;top:-20px;font-size:9px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#6B7480;font-family:Inter,sans-serif">${unit}</div>` : '';
}
function chartGrid() {
  let g=''; for (let t=0;t<=4;t++){ const y=t/4*100; g+=`<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="#ECECEC" stroke-width="1" vector-effect="non-scaling-stroke"/>`; }
  return g;
}
// Line + area chart. opts.axes=false → sparkline. Fills container width, fixed h px tall.
/* ---- Chart hover tooltip — one floating element + delegated listeners, shared by every
   trend chart. Hit targets are HTML columns (SVG uses preserveAspectRatio=none, so SVG
   circles would distort — the overlay pattern matches the existing end-dot). ---- */
function _initChartTip() {
  if (window._gfChartTipInit) return; window._gfChartTipInit = true;
  const tip = document.createElement('div'); tip.id = 'gf-charttip';
  tip.innerHTML = '<span class="gf-tt-l"></span><b></b>';
  document.body.appendChild(tip);
  const lEl = tip.querySelector('.gf-tt-l'), vEl = tip.querySelector('b');
  const show = (hit, cx, cy) => {
    lEl.textContent = hit.getAttribute('data-l') || '';
    vEl.textContent = hit.getAttribute('data-v') || '';
    tip.style.left = cx + 'px'; tip.style.top = cy + 'px'; tip.style.opacity = '1';
  };
  const hide = () => { tip.style.opacity = '0'; };
  document.addEventListener('mousemove', e => {
    const hit = e.target.closest && e.target.closest('.gf-ct-hit');
    if (hit) show(hit, e.clientX, e.clientY); else hide();
  }, { passive: true });
  document.addEventListener('touchstart', e => {
    const hit = e.target.closest && e.target.closest('.gf-ct-hit');
    if (!hit) return;
    const t = e.touches[0]; show(hit, t.clientX, t.clientY);
    setTimeout(hide, 1500);
  }, { passive: true });
}
// Build the HTML hover layer: one full-height hit column per data point.
function chartHitLayer(hits, hitW, withDot) {
  return `<div class="gf-ct-layer">` + hits.map(p =>
    `<div class="gf-ct-hit" data-l="${escHtml(p.l)}" data-v="${escHtml(p.v)}" style="left:${p.x.toFixed(2)}%;width:${hitW.toFixed(2)}%">` +
    `<span class="gf-ct-line"></span>` +
    (withDot && p.y != null ? `<span class="gf-ct-dot" style="top:${p.y.toFixed(2)}%"></span>` : '') +
    `</div>`).join('') + `</div>`;
}
function areaChart(data, w = 360, h = 150, opts = {}) {
  _initChartTip();
  const axes = opts.axes !== false;
  const vals = data.map(d=>d.v);
  // opts.min / opts.max let rate charts (e.g. 93–96% delivery) zoom the baseline so the
  // trend is visible instead of hugging a 0→200 axis.
  let min = (opts.min != null) ? opts.min : Math.min(0, ...vals);
  let max = (opts.max != null) ? opts.max : Math.max(...vals);
  if (max === min) max = min + 1;
  if (opts.max == null) max = min + niceCeil((max - min) * 1.08);
  const n = data.length;
  const px = i => n<=1?0:i/(n-1)*100, py = v => (1-(v-min)/(max-min))*100;
  const pts = data.map((d,i)=>[px(i),py(d.v)]);
  const line = 'M ' + pts.map(p=>`${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' L ');
  const area = line + ' L 100,100 L 0,100 Z';
  const plotH = axes ? h-18 : h;
  const svg = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="display:block;width:100%;height:${plotH}px">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0A3A57" stop-opacity="0.20"/><stop offset="100%" stop-color="#0A3A57" stop-opacity="0"/></linearGradient></defs>
    ${axes?chartGrid():''}
    <path d="${area}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="#0A3A57" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
  // Highlight a specific point (opts.markIndex) instead of the last — used by the Sales Snapshot
  // to mark the day/period the Yesterday/Today/Week toggle has selected.
  const mi = (opts.markIndex != null && opts.markIndex >= 0 && opts.markIndex < pts.length) ? opts.markIndex : pts.length - 1;
  const last = pts[mi];
  const dot = `<div style="position:absolute;left:${last[0]}%;top:${last[1]}%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#F2C21A;border:2px solid #fff;box-shadow:0 0 0 1px #E0B200"></div>`;
  const tipFmt = opts.tipFmt || (v => fmtNum(Math.round(v)));
  const hitW = n > 1 ? 100 / (n - 1) : 100;
  const hitLayer = chartHitLayer(data.map((d, i) => ({ x: px(i), y: py(d.v), l: (d.m || '').toString(), v: tipFmt(d.v) })), hitW, true);
  if (!axes) return `<div style="position:relative;width:100%;height:${h}px">${svg}<div style="position:absolute;inset:0;pointer-events:none">${dot}</div>${hitLayer}</div>`;
  const idx=[...new Set([0, Math.floor((n-1)/3), Math.floor(2*(n-1)/3), n-1])];
  const xlabs = idx.map(i=>`<div style="position:absolute;left:${px(i)}%;transform:translateX(-50%);white-space:nowrap">${(data[i].m||'').toString()}</div>`).join('');
  return `<div style="position:relative;width:100%;height:${h}px;padding-left:34px;box-sizing:border-box;${opts.unit?'margin-top:26px;':''}">
    ${chartUnit(opts.unit)}
    ${chartYLabels(min,max)}
    <div style="position:relative;height:${plotH}px">${svg}<div style="position:absolute;inset:0;pointer-events:none">${dot}</div>${hitLayer}</div>
    <div style="position:absolute;left:34px;right:4px;bottom:0;height:14px;font-size:9px;color:#6B7480;font-weight:600;font-family:Inter,sans-serif">${xlabs}</div>
  </div>`;
}
// Vertical bars. opts.goldLast highlights final bar; opts.color sets the rest.
function barChart(data, w = 360, h = 150, opts = {}) {
  const color = opts.color || '#0A3A57';
  const max = niceCeil(Math.max(...data.map(d=>d.v), 1) * 1.05);
  const n = data.length, slot = 100/n, inner = slot*0.6;
  const plotH = h-18;
  const showVals = opts.valueLabels !== false;
  const vfmt = opts.valueFmt || (v => fmtAxis(v));
  let bars=''; data.forEach((d,i)=>{ const bh=(d.v/max)*100; const x=i*slot+(slot-inner)/2; const fill=(opts.goldLast&&i===n-1)?'url(#barGold)':color; bars+=`<rect x="${x.toFixed(2)}" y="${(100-bh).toFixed(2)}" width="${inner.toFixed(2)}" height="${bh.toFixed(2)}" fill="${fill}"/>`; });
  const svg = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="display:block;width:100%;height:${plotH}px"><defs><linearGradient id="barGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBEBA6"/><stop offset="100%" stop-color="#E0B200"/></linearGradient></defs>${chartGrid()}${bars}</svg>`;
  // Value label above each bar (functional, not decorative)
  const vlabs = showVals ? data.map((d,i)=>{ const bh=(d.v/max)*100; const topPct=Math.max(2,(100-bh)); return `<div style="position:absolute;left:${(i*slot+slot/2).toFixed(2)}%;top:${(topPct/100*plotH).toFixed(1)}px;transform:translate(-50%,-130%);white-space:nowrap;font-size:10px;font-weight:700;color:#0A3A57;font-family:Inter,sans-serif">${vfmt(d.v)}</div>`; }).join('') : '';
  const stride=Math.max(1,Math.ceil(n/6));
  const xlabs = data.map((d,i)=> (i%stride===0||i===n-1)?`<div style="position:absolute;left:${(i*slot+slot/2).toFixed(2)}%;transform:translateX(-50%);white-space:nowrap">${(d.m||'').toString()}</div>`:'').join('');
  _initChartTip();
  const bTipFmt = opts.tipFmt || (v => fmtNum(Math.round(v)));
  const bHits = chartHitLayer(data.map((d,i)=>({ x: i*slot+slot/2, y: null, l:(d.m||'').toString(), v: bTipFmt(d.v) })), slot, false);
  return `<div style="position:relative;width:100%;height:${h}px;padding-left:34px;box-sizing:border-box;${opts.unit?'margin-top:26px;':''}">
    ${chartUnit(opts.unit)}
    ${chartYLabels(0,max)}
    <div style="position:relative;height:${plotH}px">${svg}<div style="position:absolute;inset:0;pointer-events:none">${vlabs}</div>${bHits}</div>
    <div style="position:absolute;left:34px;right:4px;bottom:0;height:14px;font-size:10px;font-weight:600;color:#3A4651;font-family:Inter,sans-serif">${xlabs}</div>
  </div>`;
}
// Grouped two-series bars — data: [{m,a,b}]
function groupedBarChart(data, w = 360, h = 160, opts = {}) {
  const cA = opts.colorA || '#0A3A57', cB = opts.colorB || 'url(#barGold)';
  const max = niceCeil(Math.max(...data.map(d=>Math.max(d.a,d.b)), 1) * 1.05);
  const n = data.length, slot = 100/n, bw = Math.min(slot*0.34, 6);
  const plotH = h-18;
  let bars=''; data.forEach((d,i)=>{ const cx=i*slot+slot/2; const ha=(d.a/max)*100, hb=(d.b/max)*100;
    bars+=`<rect x="${(cx-bw-0.6).toFixed(2)}" y="${(100-ha).toFixed(2)}" width="${bw.toFixed(2)}" height="${ha.toFixed(2)}" fill="${cA}"/><rect x="${(cx+0.6).toFixed(2)}" y="${(100-hb).toFixed(2)}" width="${bw.toFixed(2)}" height="${hb.toFixed(2)}" fill="${cB}"/>`; });
  const svg = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="display:block;width:100%;height:${plotH}px"><defs><linearGradient id="barGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBEBA6"/><stop offset="100%" stop-color="#E0B200"/></linearGradient></defs>${chartGrid()}${bars}</svg>`;
  const stride=Math.max(1,Math.ceil(n/6));
  const xlabs = data.map((d,i)=> (i%stride===0||i===n-1)?`<div style="position:absolute;left:${(i*slot+slot/2).toFixed(2)}%;transform:translateX(-50%);white-space:nowrap">${(d.m||'').toString()}</div>`:'').join('');
  _initChartTip();
  const aLabel = opts.aLabel || 'A', bLabel = opts.bLabel || 'B';
  const gHits = chartHitLayer(data.map((d,i)=>({ x: i*slot+slot/2, y: null, l:(d.m||'').toString(), v: `${aLabel} ${fmtNum(d.a)} · ${bLabel} ${fmtNum(d.b)}` })), slot, false);
  return `<div style="position:relative;width:100%;height:${h}px;padding-left:34px;box-sizing:border-box;${opts.unit?'margin-top:26px;':''}">
    ${chartUnit(opts.unit)}
    ${chartYLabels(0,max)}
    <div style="position:relative;height:${plotH}px">${svg}${gHits}</div>
    <div style="position:absolute;left:34px;right:4px;bottom:0;height:14px;font-size:10px;font-weight:600;color:#3A4651;font-family:Inter,sans-serif">${xlabs}</div>
  </div>`;
}
// Radial gauge (ring) for a single percentage
function radialGauge(pct, opts = {}) {
  const size = opts.size || 132, sw = 14, r = (size-sw)/2, c = 2*Math.PI*r, dash = c*Math.min(100,Math.max(0,pct))/100;
  return `<div class="relative inline-block" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
      <defs><linearGradient id="gaugeGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FBEBA6"/><stop offset="55%" stop-color="#F2C21A"/><stop offset="100%" stop-color="#C2900E"/></linearGradient></defs>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EFEFEF" stroke-width="${sw}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${opts.color||'url(#gaugeGold)'}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}"/>
    </svg>
    <div class="absolute inset-0 flex flex-col items-center justify-center"><div class="serif text-2xl text-navy-950 font-medium leading-none">${pct}%</div>${opts.sub?`<div class="text-[9px] text-gray-500 uppercase tracking-wider mt-1">${opts.sub}</div>`:''}</div>
  </div>`;
}

/* ---- Purchase History bento (paginated, filterable) ---- */
let PURCHASE_STATE = { page: 1, perPage: 5, cat: 'all', year: 'all' };

// Member purchase history — derived from the ONE ledger (GF_DATA.transactions) so the history, the
// "Lifetime spend" total, and the member's Spend figure all agree (single source). Falls back to a
// synthesised history only for members with no ledger activity (e.g. a brand-new enrolment).
function memberPurchases(m) {
  const led = (GF_DATA.transactions || []).filter(t => t.memberId === m.id && !t.reversed);
  if (led.length) {
    const oName = GF_DATA._oName || (GF_DATA._oName = (() => { const o = {}; (GF_DATA.outlets||[]).forEach(x => o[x.code] = x.name); return o; })());
    // Item name is built from the line's OWN category + grade so it always agrees with the Category
    // column (the seed's per-line designCode is random and would otherwise mislabel the item).
    const singular = { Rings:'Cincin', Bracelets:'Gelang', Earrings:'Subang', Necklaces:'Rantai', Anklets:'Gelang Kaki', Bangles:'Bangle', Pendants:'Loket' };
    return led.slice().sort((a,b) => String(b.ts||'').localeCompare(String(a.ts||''))).map(t => {
      const lines = t.lines || [], l0 = lines[0] || {};
      const grams = +lines.reduce((s,l) => s + (l.grams||0), 0).toFixed(1);
      const pc = GF_DATA.productCategories.find(c => c.key === l0.category) || {};
      const name = pc.investment ? `Gold Bar · ${l0.grade||'999.9'}` : `${singular[pc.label] || pc.label || l0.category || 'Item'} Emas ${l0.grade||'916'}`;
      const item = name + (lines.length > 1 ? ` +${lines.length-1} more` : '');
      return { date: formatDate((t.ts||'').slice(0,10), { written:true }), item, category: l0.category || m.topCategory, grade: l0.grade || '916', grams, invoice: t.invoiceNo, amount: Math.round(t.netPaid != null ? t.netPaid : (t.grossTotal||0)), outlet: oName[t.outletCode] || m.outlet, payment: t.paymentMethod || 'Cash' };
    });
  }
  if (GF_DATA.purchaseHistory[m.id]) return GF_DATA.purchaseHistory[m.id];
  const cats  = ['Cincin','Rantai','Subang','Loket','Gelang','Gold Bar'];
  const dates = ['12 May 2026','02 Apr 2026','18 Feb 2026','24 Dec 2025','08 Oct 2025','15 Aug 2025','20 Jun 2025','11 Apr 2025'];
  const styles = ['Klasik','Pesona Tiga','Heirloom','Bunga Tanjung'];
  const n = Math.max(3, Math.min(8, Math.round((m.spendYTD||3000)/2200)+2));
  const out = [];
  for (let i=0;i<n;i++) {
    const cat   = i===0 ? m.topCategory : cats[(i*3 + m.name.length) % cats.length];
    const grade = cat==='Gold Bar' ? '999.9' : '916';
    const amount = Math.max(420, Math.round(((m.spendYTD||3000)/n) * (0.7 + (i%3)*0.2)));
    const grams = +(amount / (grade==='999.9'?380:330)).toFixed(1);
    out.push({ date:dates[i%dates.length], item:`${cat} Emas ${grade} — ${styles[i%styles.length]}`, category:cat, grade, grams, invoice:`INV-${m.id.slice(-4)}-${1000+i*137}`, amount, outlet:m.outlet, payment:['Cash','Credit Card','Debit Card','Atome'][i%4] });
  }
  return out;
}

function purchaseFreq(list) {
  return list.length>=10 ? 'Monthly' : list.length>=6 ? 'Quarterly' : list.length>=3 ? 'Twice a year' : 'Yearly';

// One source of truth for installment counts — derived from the actual plan records so
// every display reconciles: active (non-elapsed) vs total, and per-provider sums match.
const INSTALL_PROV_META = {
  'Atome':           { short:'Atome',  color:'#BCD800' },
  'Shopee PayLater': { short:'Shopee', color:'#EE4D2D' },
  'GrabPayLater':    { short:'Grab',   color:'#00B14F' },
  'Boost':           { short:'Boost',  color:'#EF5B2B' },
  'Aeon Credit':     { short:'Aeon',   color:'#B0187E' }
};
function installStats() {
  const plans = GF_DATA.atomePlans || [];
  const byProv = {}; let active = 0;
  plans.forEach(p => {
    byProv[p.provider] = (byProv[p.provider] || 0) + 1;
    if (Math.min(p.totalMonths, p.paidMonths || 0) < p.totalMonths) active++;
  });
  const providers = Object.entries(byProv).sort((a,b)=>b[1]-a[1]).map(([name, count]) => ({
    name, count, short: (INSTALL_PROV_META[name]||{}).short || name, color: (INSTALL_PROV_META[name]||{}).color || '#94A3B8'
  }));
  return { total: plans.length, active, providers };
}
// F8 — provider data sync. Each provider's plans carry a 'last updated' stamp; uploading a
// provider status file re-stamps that provider to today. Seeded with recent, staggered syncs.
const INSTALL_PROVIDERS = ['Atome','Shopee PayLater','GrabPayLater','Boost','Aeon Credit'];
const PROVIDER_SYNC = { 'Atome':'2026-05-14', 'Shopee PayLater':'2026-05-13', 'GrabPayLater':'2026-05-12', 'Boost':'2026-05-08', 'Aeon Credit':'2026-05-06' };
let PROVIDER_UPLOAD_SEL = 'Atome';
function providerSyncDate(provider){ return PROVIDER_SYNC[provider] || null; }
function providerShort(provider){ return (INSTALL_PROV_META[provider]||{}).short || provider; }
function installSyncBanner(){
  const dates = INSTALL_PROVIDERS.map(pv=>PROVIDER_SYNC[pv]).filter(Boolean).sort();
  const latest = dates.length ? dates[dates.length-1] : null;
  return `
    <div class="card !p-3 mb-4 flex items-center justify-between gap-3 flex-wrap">

function providerSyncCommit(){
  const prov = PROVIDER_UPLOAD_SEL;
  const today = (typeof DEMO_TODAY_ISO!=='undefined') ? DEMO_TODAY_ISO : '2026-05-15';
  const n = (GF_DATA.atomePlans||[]).filter(p=>p.provider===prov).length;
  PROVIDER_SYNC[prov] = today;
  closePlanModal();
  toast(`${fmtNum(n)} ${prov} plans synced · updated ${formatDate(today,{written:true})}`,'success');
  if (location.hash.startsWith('#atome')) route();

// F9 — 'New Plans' trend windowed by a 7d/30d/60d/90d preset, derived from REAL plan start
// dates (was a hardcoded 12-month [180…495] seed + fake +34%).
let INSTALL_TREND_RANGE = '90d', INSTALL_TREND_CUSTOM = null;
function installTrendDays(){
  if (INSTALL_TREND_RANGE==='custom' && INSTALL_TREND_CUSTOM && INSTALL_TREND_CUSTOM.from && INSTALL_TREND_CUSTOM.to)
    return Math.max(1, Math.round((new Date(INSTALL_TREND_CUSTOM.to)-new Date(INSTALL_TREND_CUSTOM.from))/864e5)+1);
  return ({'7d':7,'30d':30,'60d':60,'90d':90})[INSTALL_TREND_RANGE] || 90;
}
function installTrendLabel(){
  if (INSTALL_TREND_RANGE==='custom') return 'custom range';
  return ({'7d':'last 7 days','30d':'last 30 days','60d':'last 60 days','90d':'last 90 days'})[INSTALL_TREND_RANGE] || ('last '+installTrendDays()+' days');
}
function installTrendWindow(days){
  const endISO = (typeof DEMO_TODAY_ISO!=='undefined') ? DEMO_TODAY_ISO : '2026-05-15';
  const end = new Date(endISO+'T23:59:59');
  const nB = Math.max(2, Math.min(12, Math.round(days/7)));        // weekly-ish buckets, clamp 2..12
  const span = days*864e5, startWin = new Date(end.getTime()-span);
  const bucket = new Array(nB).fill(0);
  (GF_DATA.atomePlans||[]).forEach(p => {
    const t = Date.parse(p.startISO || p.startDate); if (isNaN(t)) return;
    if (t < startWin.getTime() || t > end.getTime()) return;
    let idx = Math.floor((t - startWin.getTime())/span*nB); if (idx>=nB) idx=nB-1; if (idx<0) idx=0;
    bucket[idx]++;
  });
  const points = bucket.map((v,i) => { const bEnd = new Date(startWin.getTime()+span*(i+1)/nB); return { m: bEnd.getDate()+' '+_BC_MONTHS[bEnd.getMonth()], v }; });
  const total = bucket.reduce((a,b)=>a+b,0), half = Math.floor(nB/2);
  const older = bucket.slice(0,half).reduce((a,b)=>a+b,0), recent = bucket.slice(half).reduce((a,b)=>a+b,0);
  const deltaPct = older ? Math.round((recent-older)/older*100) : (recent>0?100:0);
  return { points, total, deltaPct };
}
function setInstallTrendRange(inst){
  if (!inst) return;
  INSTALL_TREND_RANGE = inst.value; INSTALL_TREND_CUSTOM = inst.custom || null;
  const el = document.getElementById('installTrendBody'); if (el) el.innerHTML = installTrendInner();
}
function installTrendInner(){
  const w = installTrendWindow(installTrendDays());
  if (!w.total) return `
    <div class="flex-1 flex flex-col items-center justify-center text-center py-10 min-h-[180px]">
      <div class="text-sm font-medium text-navy-950">No new plans in the ${installTrendLabel()}</div>
      <div class="text-xs text-gray-500 font-medium mt-1">Widen the range to see the trend.</div>
    </div>`;
  return `
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs text-gray-500 font-medium">${fmtNum(w.total)} new plans · ${installTrendLabel()}</span>
      <span class="text-xs ${w.deltaPct>=0?'text-pos':'text-neg'} font-medium">${w.deltaPct>=0?'▲':'▼'} ${Math.abs(w.deltaPct)}%</span>
    </div>
    <div class="flex-1 min-h-[180px]">${areaChart(w.points,400,180)}</div>`;
}

// Searchable multi-select — for pick-from-a-known-set fields (voucher states / outlets) so the user

// saveVoucher already reads them:  #vf-states = states whose EVERY outlet is on (kept as the state);
// #vf-outlets = individually-picked outlets inside partially-selected states.
function outletScopePicker(selectedStates, selectedOutlets) {
  const groups = {};
  (GF_DATA.outlets || []).forEach(o => { (groups[o.state] = groups[o.state] || []).push(o); });

  const selS = new Set(selectedStates || []);

  const rows = states.map(st => {
    const outs = groups[st].slice().sort((a,b)=>a.name.localeCompare(b.name));
    const full = selS.has(st);
    const kids = outs.map(o => `
      <label class="scope-out flex items-center gap-2 pl-8 pr-2.5 py-1.5 rounded hover:bg-cream-50 cursor-pointer text-sm" data-s="${escHtml((o.name+' '+o.code+' '+st).toLowerCase())}">

        <span class="text-navy-950 truncate">${escHtml(o.name)}</span>
        <span class="text-[10px] text-gray-400 font-mono-tight ml-auto flex-shrink-0">${escHtml(o.code)}</span>
      </label>`).join('');
    return `<div class="scope-grp mb-0.5" data-state="${escHtml(st)}" data-s="${escHtml(st.toLowerCase())}">
      <label class="scope-state flex items-center gap-2 px-2.5 py-1.5 rounded hover:bg-cream-100 cursor-pointer bg-cream-50/80">
        <input type="checkbox" class="scope-state-cb w-4 h-4 accent-gold-500 flex-shrink-0" data-state="${escHtml(st)}" onchange="scopeStateToggle(this)"/>
        <span class="text-[11px] font-medium tracking-wide uppercase text-navy-950">${escHtml(st)}</span>
        <span class="text-[10px] text-gray-400 ml-auto flex-shrink-0">${outs.length} outlet${outs.length>1?'s':''}</span>
      </label>
      ${kids}
    </div>`;
  }).join('');
  return `<div>
    <div class="border border-gray-300 rounded overflow-hidden">
      <input type="text" placeholder="Search state or outlet…" oninput="scopeFilterOutlets(this.value)" class="gf-field w-full px-3 text-sm border-0 border-b border-gray-200 focus:outline-none focus:bg-cream-50/40"/>
      <div id="scope-list" class="max-h-64 overflow-y-auto p-1">${rows}</div>
    </div>
    <input type="hidden" id="vf-states" value="${[...selS].join(',')}"/>
    <input type="hidden" id="vf-outlets" value="${[...selO].join(',')}"/>
    <div id="scope-count" class="text-[10px] text-gray-500 mt-1"></div></div>`;
}
function scopeStateToggle(cb){
  const st = cb.dataset.state; cb.indeterminate = false;
  document.querySelectorAll('.scope-out-cb[data-state="'+CSS.escape(st)+'"]').forEach(o=>{ o.checked = cb.checked; });
  scopeSyncOutlets();
}
function scopeOutletToggle(cb){
  const st = cb.dataset.state;
  const kids = [...document.querySelectorAll('.scope-out-cb[data-state="'+CSS.escape(st)+'"]')];
  const head = document.querySelector('.scope-state-cb[data-state="'+CSS.escape(st)+'"]');
  if (head){ const on = kids.filter(k=>k.checked).length; head.checked = on===kids.length && kids.length>0; head.indeterminate = on>0 && on<kids.length; }
  scopeSyncOutlets();
}
function scopeSyncOutlets(){
  const states=[], outlets=[];
  document.querySelectorAll('#scope-list .scope-grp').forEach(g=>{
    const kids=[...g.querySelectorAll('.scope-out-cb')];
    const on=kids.filter(k=>k.checked);
    if (kids.length && on.length===kids.length) states.push(g.dataset.state);
    else on.forEach(k=>outlets.push(k.value));
  });
  const hs=document.getElementById('vf-states'); if(hs) hs.value=states.join(',');
  const ho=document.getElementById('vf-outlets'); if(ho) ho.value=outlets.join(',');
  const c=document.getElementById('scope-count');
  if(c){ c.textContent = (!states.length && !outlets.length) ? 'All outlets — network-wide (no restriction)'
    : [states.length?states.length+' full state'+(states.length>1?'s':''):'', outlets.length?outlets.length+' outlet'+(outlets.length>1?'s':''):''].filter(Boolean).join(' · ') + ' selected'; }
}
// Set each state header's checked/indeterminate from its children + fill the count (post-render).
function scopeInit(){
  document.querySelectorAll('#scope-list .scope-grp').forEach(g=>{
    const kids=[...g.querySelectorAll('.scope-out-cb')];
    const on=kids.filter(k=>k.checked).length;
    const head=g.querySelector('.scope-state-cb');
    if(head){ head.checked = on===kids.length && kids.length>0; head.indeterminate = on>0 && on<kids.length; }
  });
  scopeSyncOutlets();
}
function scopeFilterOutlets(q){
  q=(q||'').toLowerCase().trim();
  document.querySelectorAll('#scope-list .scope-grp').forEach(g=>{
    const stMatch = g.dataset.s.includes(q);
    let anyKid=false;
    g.querySelectorAll('.scope-out').forEach(o=>{ const show = !q || stMatch || o.dataset.s.includes(q); o.style.display = show?'':'none'; if(show) anyKid=true; });
    g.style.display = (!q || stMatch || anyKid) ? '' : 'none';
  });
}
function modalHead(eyebrow, title) {
  return `<div class="flex items-start justify-between mb-4 gap-3"><div><div class="text-xs font-medium tracking-[0.18em] uppercase text-gold-700 mb-1">${eyebrow}</div><h2 class="serif text-2xl text-navy-950 font-medium leading-tight">${title}</h2></div><button type="button" class="text-gray-400 hover:text-gray-700 text-3xl leading-none" onclick="closePlanModal()">&times;</button></div>`;

// Parse a comma/space list of scope tokens (state names or outlet codes) → clean array, [] = network-wide.
function parseScopeList(s){ return String(s||'').split(',').map(x=>x.trim()).filter(Boolean); }
function saveVoucher(id) {
  const val = k => { const el = document.getElementById(k); return el ? el.value.trim() : ''; };
  let title = val('vf-title'); const dv = val('vf-val');
  if (!title) { toast('Enter a voucher title', 'warn'); return; }
  // Standardise RM vouchers to "RM x OFF" wording (register 17 Jul). Fold the value in when the
  // title doesn't already carry one; upgrade a bare "RM 50" to "RM 50 OFF".
  if (dv && !/RM|%|pts/i.test(title)) title = (/^RM/i.test(dv) ? dv + ' OFF' : dv) + ' · ' + title;
  title = title.replace(/(RM\s?\d+)(?!\s*OFF)(\s*·|\s*$)/i, '$1 OFF$2');
  const dvNum = (dv.match(/RM\s?(\d+)/) || [])[1];
  const rec = { title, code: val('vf-code')||'GF-'+String(Date.now()).slice(-5), subtitle: val('vf-sub'), tier: val('vf-tier'), expires: val('vf-exp'), status: val('vf-status'), terms: val('vf-terms'), theme: val('vf-theme')||'gold', icon: val('vf-icon')||'gift',
    states: parseScopeList(val('vf-states')), outlets: parseScopeList(val('vf-outlets')) };
  if (dvNum) rec.value = +dvNum;
  const ms = parseInt(val('vf-minspend')); if (ms) rec.minSpend = ms;
  const vops = GF_DATA._vops || (GF_DATA._vops = { created:[], edited:{}, deleted:[] });
  if (!id || id === 'NEW') {
    rec.id = 'V-USR-' + String(Date.now()).slice(-6);
    GF_DATA.vouchers.unshift(rec); vops.created.unshift(rec);
    GFP.set('voucherOps', vops);
    toast('Voucher created · ' + rec.title, 'success');
    closePlanModal(); route();
  } else {
    confirmEdit('Save changes to “' + escHtml(title) + '”?', () => {
      const cur = GF_DATA.vouchers.find(x => x.id === id); if (cur) Object.assign(cur, rec);
      vops.edited[id] = Object.assign(vops.edited[id]||{}, rec);
      GFP.set('voucherOps', vops);
      toast('Voucher saved', 'success');
      closePlanModal(); route();
    });
  }
}
// Second-layer verification for every mutating action (client rule: no edit/delete lands
// without a confirm). Thin wrappers over Dialog.ask.
function confirmEdit(body, onConfirm, opts){ Dialog.ask(Object.assign({ title:'Save changes?', confirmText:'Save changes', body: body }, opts||{}, { onConfirm })); }
function confirmDelete(body, onConfirm, opts){ Dialog.ask(Object.assign({ title:'Confirm delete', danger:true, confirmText:'Delete', body: body }, opts||{}, { onConfirm })); }

function deleteVoucher(id, title) {
  if (!can('delete')) { toast('Voucher deletion is restricted to HQ Admin', 'warn'); return; }
  Dialog.ask({
    title: 'Delete voucher', danger: true, confirmText: 'Delete',
    body: 'Delete voucher “' + title + '”? This cannot be undone.',
    onConfirm: () => {
      GF_DATA.vouchers = GF_DATA.vouchers.filter(v => v.id !== id);
      const vops = GF_DATA._vops || (GF_DATA._vops = { created:[], edited:{}, deleted:[] });

// §1.5.1 — POS ingest with a real duplicate-review step. A mock batch is built from
// the live ledger (real duplicates + blank-invoice rejects + new rows) and partitioned
// via partitionUpload BEFORE commit. Nothing here is fake: the outcome the admin sees
// is whatever partitionUpload + their resolution actually produce.
let POS_UPLOAD = null;
function posBuildBatch() {
  const existing = GF_DATA.transactions || [];
  const outlets = (GF_DATA.outlets || []).map(o => o.code);
  const incoming = [];
  // 32 genuine duplicates — real rows already in the ledger (same outlet+invoice key).
  existing.slice(0, 32).forEach(t => incoming.push({ outletCode: t.outletCode, invoiceNo: t.invoiceNo, amount: t.grossTotal, _date: (t.ts||'').slice(0,10) }));
  // 2 blank-invoice rows — cannot be de-duplicated, must be rejected.
  incoming.push({ outletCode: outlets[0]||'MBM', invoiceNo: '',   amount: 1280 });
  incoming.push({ outletCode: outlets[1]||'ABG', invoiceNo: '  ', amount: 940  });
  // 1,380 brand-new rows with unique invoice numbers.
  for (let i = 0; i < 1380; i++) {
    const oc = outlets[i % outlets.length] || 'MBM';
    incoming.push({ outletCode: oc, invoiceNo: `INV-${oc}-UP${String(i).padStart(5,'0')}`, amount: 500 + ((i*37)%9000) });
  }
  return incoming;
}
function posUploadPreview() {
  POS_UPLOAD = partitionUpload(posBuildBatch(), GF_DATA.transactions);
  POS_UPLOAD.resolution = 'skip';           // Skip is the default
  POS_UPLOAD.rowDecision = {};              // per-row decisions for "Review each"
  renderPosReview();
}
function posOutcome() {
  const p = POS_UPLOAD;
  if (!p) return { imported: 0, skipped: 0, replaced: 0, rejected: 0 };
  let replaced = 0;
  if (p.resolution === 'replace' && can('edit')) replaced = p.duplicate.length;
  else if (p.resolution === 'review') replaced = p.duplicate.filter(d => p.rowDecision[txnKey(d)] === 'replace').length;
  return { imported: p.new.length + replaced, skipped: p.duplicate.length - replaced, replaced, rejected: p.rejected.length };
}
function setPosResolution(val) {
  if (val === 'replace' && !can('edit')) { toast('Replace is restricted to HQ Admin','warn'); return; }
  POS_UPLOAD.resolution = val;
  renderPosReview();
}
function setPosRowDecision(key, val) {
  if (val === 'replace' && !can('edit')) { toast('Replace is restricted to HQ Admin','warn'); return; }
  POS_UPLOAD.rowDecision[key] = val;
  renderPosReview();
}
function posCommit() {
  const p = POS_UPLOAD, o = posOutcome();
  // Record the import in the real upload history (observable in the reports table).
  const u = GF_DATA.salesUploads;
  const who = (typeof SESSION !== 'undefined' && SESSION.user) || u.lastBy;
  u.history.unshift({ period: 'Jul 2026', uploaded: 'today', by: who, rows: o.imported, status: 'processed' });

   4) BROADCAST PERFORMANCE (rendered inside the Broadcasts › Performance tab).
   The old orphan `#campaigns` route + its templates block were deleted (F12):
   Broadcasts is now a single 4-tab area (F8).

// F12 — Performance is windowed by a 7d/30d/60d/90d preset (same presets as Sales & Reports).
let BC_PERF_RANGE = '90d', BC_PERF_CUSTOM = null;
function bcPerfDays(){
  if (BC_PERF_RANGE === 'custom' && BC_PERF_CUSTOM && BC_PERF_CUSTOM.from && BC_PERF_CUSTOM.to)
    return Math.max(1, Math.round((new Date(BC_PERF_CUSTOM.to) - new Date(BC_PERF_CUSTOM.from))/864e5) + 1);
  return ({ '7d':7, '30d':30, '60d':60, '90d':90 })[BC_PERF_RANGE] || 90;
}
const _BC_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Parse a broadcast's display date ("08 Feb 2026 · 11:00") to a real Date; null if unparseable.
function bcParseDate(str){ if(!str) return null; const s = String(str).split('·')[0].trim(); const t = Date.parse(s); return isNaN(t) ? null : new Date(t); }
// All SENT broadcasts inside [today-days, today], with derived totals. Single source for the tab.
function bcWindowStats(days){
  const endISO = (typeof DEMO_TODAY_ISO !== 'undefined') ? DEMO_TODAY_ISO : '2026-05-15';
  const end = new Date(endISO + 'T23:59:59');
  const start = new Date(end); start.setDate(start.getDate() - days);
  const list = (GF_DATA.broadcasts || [])
    .filter(b => b.status === 'Sent')
    .map(b => ({ ...b, _d: bcParseDate(b.date), chans: _bcChans(b) }))
    .filter(b => b._d && b._d >= start && b._d <= end)
    .sort((a,b) => a._d - b._d);
  const totalRecipients = list.reduce((s,b)=>s+b.recipients,0);
  const waCost  = list.reduce((s,b)=>s+b.recipients*BROADCAST_RATE.whatsapp,0);
  const smsCost = list.reduce((s,b)=>s+(b.chans.includes('sms')?b.recipients*BROADCAST_RATE.sms:0),0);
  const smsReach = list.filter(b=>b.chans.includes('sms')).reduce((s,b)=>s+b.recipients,0);
  const totalMsgs = totalRecipients + smsReach;
  const avgDelivered = totalRecipients ? list.reduce((s,b)=>s+b.recipients*(b.delivered||0),0)/totalRecipients : 0;
  const _rr = list.filter(b=>b.redeem != null);
  const avgRedeem = _rr.length ? _rr.reduce((s,b)=>s+b.redeem,0)/_rr.length : 0;
  return { list, days, totalRecipients, waCost, smsCost, totalCost: waCost+smsCost, smsReach,
    waPct: totalMsgs ? Math.round(totalRecipients/totalMsgs*100) : 0, avgDelivered, avgRedeem };
}
function bcPerfLabel(b){ const d=b._d; return d ? (d.getDate()+' '+_BC_MONTHS[d.getMonth()]) : (b.date||''); }
function setBcPerfRange(inst){
  if (!inst) return;
  BC_PERF_RANGE = inst.value; BC_PERF_CUSTOM = inst.custom || null;
  const el = document.getElementById('bcPerfBody');
  if (el) { el.innerHTML = bcPerfInner(); mountBcPerfCampaigns(); }
}
function campaignsPerformance(){
  return `
    <div class="flex items-center justify-between gap-3 flex-wrap mb-4">

}

  const w = bcWindowStats(bcPerfDays());

  const smsPct = 100 - w.waPct;

      </div>`;

  // Deliverability watch — the few campaigns with the most single-tick (need number verification).
  const watch = list.slice().filter(b=>(b.deliveredSingleTick||0)>0).sort((a,b)=>(b.deliveredSingleTick||0)-(a.deliveredSingleTick||0)).slice(0,5);
  return kpis + `

        <div class="flex items-center justify-between mb-3"><h3 class="text-lg font-medium text-navy-950">Reach per broadcast</h3><span class="text-xs text-gray-500 font-medium">${fmtNum(list.length)} sent</span></div>

          <div style="background:#0E5C8A;width:${w.waPct}%" title="WhatsApp"></div>
          <div style="background:#F2C21A;width:${smsPct}%" title="SMS fallback"></div>
        </div>
        <div class="space-y-2 text-sm">
          <div class="flex items-center justify-between"><span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm" style="background:#0E5C8A"></span>WhatsApp</span><span class="font-medium font-mono-tight text-navy-950">${w.waPct}%</span></div>
          <div class="flex items-center justify-between"><span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm bg-gold-500"></span>SMS fallback</span><span class="font-medium font-mono-tight text-navy-950">${smsPct}%</span></div>
        </div>
        <div class="mt-4 pt-3 border-t border-gray-100">
          <div class="text-[10px] uppercase tracking-wider font-medium text-gray-500 mb-2">Deliverability funnel</div>
          ${[['Sent',100,'bg-navy-950',fmtNum(w.totalRecipients)],['Delivered',Math.round(w.avgDelivered),'bg-pos',w.avgDelivered.toFixed(0)+'%'],['Single-tick',Math.max(2,Math.round(stPct)),'bg-warn',fmtNum(stTotal)]].map(([l,wd,c,val])=>`

        </div>
      </div>
    </div>

// Goldfinch broadcasts ONLY from approved templates — state tracks the chosen template + its filled variables.
const BROADCAST_STATE = {
  name: 'Raya Gold Promo · June',
  templateId: 'promo',
  vars: {},                      // numbered variable values { 1:'…', 2:'…' }
  channels: { whatsapp: true, sms: false },   // WhatsApp-first (register 16 Jul); SMS de-emphasised (untrackable)
  audience: { entry: false, bronze: false, silver: true, gold: true },
  sender:    'MG7a4f2c8b9e1d3c5a6b8e9f0a1c2d3e4f',
  templateSid:'HX1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p',
  scheduleMode: 'later',
  sendAt: '2026-05-06T10:30'
};
function bcTemplate() { return GF_DATA.broadcastTemplates.find(t => t.id === BROADCAST_STATE.templateId) || GF_DATA.broadcastTemplates[0]; }
function bcInitVars() { const t = bcTemplate(); BROADCAST_STATE.vars = {}; t.vars.forEach(v => { BROADCAST_STATE.vars[v.n] = v.sample; }); BROADCAST_STATE.templateSid = t.sid; }
// Field {{1}} is ALWAYS the recipient's name — it is personalised per member from the chosen
// audience, never typed by hand. The composer locks it; the live preview shows a representative
// recipient so the client can see the merge in action.
function bcAudienceMembers() {
  const a = BROADCAST_STATE.audience || {};
  const on = Object.keys(a).filter(k => a[k]);
  const list = (GF_DATA.members || []).filter(m => on.includes(String(m.tier||'').toLowerCase()));
  return list.length ? list : (GF_DATA.members || []);
}
function bcGivenName(fullName){ const p = String(fullName||'').trim().split(/\s+/).filter(Boolean); return p.length>=3 ? p[1] : (p.length===2 ? p[1] : (p[0]||'there')); }
function bcSampleGivenName(){ const m = bcAudienceMembers()[0]; return m ? bcGivenName(m.name) : 'Wei Ming'; }
function bcFilledBody() { return bcTemplate().body.replace(/\{\{(\d+)\}\}/g, (m,n) => (+n === 1) ? bcSampleGivenName() : (BROADCAST_STATE.vars[n] || m)); }
// A clean, readable one-line example (sample values filled in) — no {{n}} gibberish.
function bcSampleLine(t) {
  let s = t.body;
  t.vars.forEach(v => { s = s.split('{{'+v.n+'}}').join(v.sample); });
  return s.split('\n')[0];
}
// §8.2 — gross tier headcount before consent is applied.
function bcGrossReach() { const a = BROADCAST_STATE.audience, T = GF_DATA.tiers; return (a.entry?T.entry.count:0)+(a.bronze?T.bronze.count:0)+(a.silver?T.silver.count:0)+(a.gold?T.gold.count:0); }
// Share of members who have opted OUT of marketing on every selected channel (§1.4/§8.2).
// Derived from the live GF_DATA.members sample so the toggle a member flips in the
// portal actually moves this number.
function bcOptOutRate() {
  const chans = bcChannelsList();
  const ms = GF_DATA.members || [];
  if (!ms.length || !chans.length) return 0;
  const out = ms.filter(m => {
    const mk = (m.optIn && m.optIn.marketing) || {};
    return chans.every(c => mk[c] === false);
  }).length;
  return out / ms.length;
}
function bcExcluded() { return Math.round(bcGrossReach() * bcOptOutRate()); }
// Estimated Reach EXCLUDES opted-out members — this is the number we cost and send to.
function bcReach() { return Math.max(0, bcGrossReach() - bcExcluded()); }

  if (sub === 'new') return broadcastComposer();

  // ≥30 broadcasts live in GF_DATA (seeded, audience-derived reach).
  const past = GF_DATA.broadcasts;

  // F8 — ONE Broadcasts area: Templates · Automated Triggers · Drafts · History · Performance.
  // Lifecycle triggers (birthday / win-back / installment) live here as the automated-send engine.
  window._campaigns = past.map((b,i) => {
    const sent = b.status === 'Sent' || b.status === 'Sending';
    return {
      ...b,
      channels: b.channel.includes('SMS') ? (b.channel.includes('WhatsApp') ? ['whatsapp','sms'] : ['sms']) : ['whatsapp'],
      // §5.3 — delivery rate (not open/read) + single-tick count (likely-wrong numbers).
      delivered: sent ? 94 + ((i * 7) % 6) : null,
      deliveredSingleTick: sent ? Math.max(3, Math.round(b.recipients * 0.018)) : 0
    };
  });

};

  return String(text)

}

function voucherTheme(key) { return VOUCHER_THEMES.find(t => t.key === key) || VOUCHER_THEMES[0]; }

// Resolve a voucher's look: explicit picks win; else infer theme + icon from the copy.
function resolveVoucherLook(v) {
  const t = v.title || '', lc = (t + ' ' + (v.subtitle || '')).toLowerCase();
  let themeKey = 'gold', iconKey = 'gift';
  if (v.status === 'locked')                          { themeKey = 'navy';   iconKey = 'starFill'; }
  else if (/welcome/.test(lc))                        { themeKey = 'green';  iconKey = 'sparkles'; }
  else if (/birthday|bonus point/.test(lc))           { themeKey = 'purple'; iconKey = 'cake'; }
  else if (/vip|early/.test(lc))                      { themeKey = 'vip';    iconKey = 'starFill'; }
  else if (/win-?back/.test(lc))                      { themeKey = 'red';    iconKey = 'refresh'; }
  else if (/cny|raya|festive|merdeka|aidil/.test(lc)) { themeKey = 'red';    iconKey = 'tag'; }
  if (v.theme && voucherTheme(v.theme)) themeKey = v.theme;                  // admin's explicit pick
  if (v.icon && ICONS[v.icon]) iconKey = v.icon;
  const th = voucherTheme(themeKey);
  return { themeKey, iconKey, tint: th.tint, ink: th.ink, icon: ICONS[iconKey] || ICONS.gift };
}
// Headline value shown on the coupon stub.
function voucherBig(v) {
  const t = v.title || '';
  const rm = t.match(/RM\s?\d+/), pct = t.match(/\d+%/), ptsN = t.match(/(\d[\d,]*)\s*(?:bonus\s*)?point/i);

// C6/C7 — recompute every KPI from GF_DATA.transactions filtered by the selected window
// (anchored at the latest sale so the demo data is in range), plus the compare period.
function reportWindows() {
  const txns = GF_DATA.transactions.filter(t => !t.reversed);
  // Anchor "today" to the demo date (15 May 2026), NOT the latest ledger row. The ledger carries
  // some post-dated rows; anchoring here makes the window match its own caption AND reconcile with
  // the Dashboard (which reads the same ledger via ledgerWindowAgg). Fixes the caption-vs-data drift.
  const end = new Date((typeof DEMO_TODAY_ISO !== 'undefined' ? DEMO_TODAY_ISO : '2026-05-15') + 'T23:59:59');
  // Custom range: use the picked from/to (inclusive) directly; otherwise a rolling window.
  let curFrom, curEnd = end, days;
  if (REPORT_RANGE === 'custom' && REPORT_CUSTOM && (REPORT_CUSTOM.from || REPORT_CUSTOM.to)) {
    curFrom = REPORT_CUSTOM.from ? new Date(REPORT_CUSTOM.from + 'T00:00:00') : new Date(end);
    curEnd  = REPORT_CUSTOM.to   ? new Date(REPORT_CUSTOM.to   + 'T23:59:59') : end;
    days = Math.max(1, Math.round((curEnd - curFrom) / 864e5));
  } else {
    days = ({ '7d':7, '30d':30, '60d':60, '90d':90 })[REPORT_RANGE] || 30;
    curFrom = new Date(end); curFrom.setDate(curFrom.getDate() - days);
  }
  let cmpTo, cmpFrom;
  if (REPORT_COMPARE === 'yoy') { cmpTo = new Date(curEnd); cmpTo.setFullYear(cmpTo.getFullYear()-1); cmpFrom = new Date(cmpTo); cmpFrom.setDate(cmpFrom.getDate()-days); }
  else { cmpTo = new Date(curFrom); cmpFrom = new Date(curFrom); cmpFrom.setDate(cmpFrom.getDate()-days); }
  // Scope holds a set of selected state names (empty ⇒ all) — stable regardless of live counts.
  const scopeSet = reportScopeSet();
  const oState = {}; GF_DATA.outlets.forEach(o => oState[o.code] = o.state);
  const inScope = t => !scopeSet || scopeSet.has(oState[t.outletCode]);
  const end2 = curEnd;
  const cur = txns.filter(t => inScope(t) && new Date(t.ts) > curFrom && new Date(t.ts) <= end2);
  const cmp = REPORT_COMPARE === 'none' ? [] : txns.filter(t => inScope(t) && new Date(t.ts) > cmpFrom && new Date(t.ts) <= cmpTo);
  return { cur, cmp, days, end: end2, from: curFrom };
}
function reportAgg(arr) {
  const rev = Math.round(arr.reduce((s,t) => s + (t.netPaid||0), 0));
  const tx = arr.length;
  const grams = Math.round(arr.reduce((s,t) => s + t.lines.reduce((a,l)=>a+l.grams,0), 0));
  const members = new Set(arr.filter(t=>t.memberId).map(t=>t.memberId)).size;
  return { rev, tx, avg: tx ? Math.round(rev/tx) : 0, grams, members };
}
// Human label for the active master range (matches the 7d/30d/60d/90d/Custom control).
function reportWindowLabel() {
  if (REPORT_RANGE === 'custom' && REPORT_CUSTOM && (REPORT_CUSTOM.from || REPORT_CUSTOM.to))
    return (typeof REPORT_PERIOD === 'string' ? REPORT_PERIOD : 'custom range');
  return ({ '7d':'last 7 days','30d':'last 30 days','60d':'last 60 days','90d':'last 90 days' })[REPORT_RANGE]
    || ('last ' + reportWindows().days + ' days');
}
// Member Growth, windowed to the master range: net adds scale with the selected days,
// and the mini-trend is the trailing slice ending at the current member count.
function memberGrowthModel() {
  const days = reportWindows().days;
  const totalNow = GF_DATA.kpis.totalMembers;
  const g = GF_DATA.growthByMonth;
  const perDay = (totalNow - g[0].v) / 365;                 // 12-month seed span
  const added = Math.max(1, Math.round(perDay * days));
  const start = Math.max(0, totalNow - added);
  const N = 12, pts = [];
  for (let i = 0; i < N; i++) { const f = i/(N-1); pts.push({ m:'', v: Math.round(start + (totalNow-start)*(0.25*f + 0.75*f*f)) }); }
  return { days, added, start, now: totalNow, pts };
}
// Tier mix, windowed to the master range: distinct members who transacted in the window,
// split by the tier proportions — so the numbers move with the range like everything else.
function tierWindowModel() {
  const active = reportAgg(reportWindows().cur).members;
  const tiers = Object.values(GF_DATA.tiers);
  const baseTotal = tiers.reduce((s,t)=>s+t.count,0) || 1;
  let scaled = tiers.map(t => ({ name:t.name, color:t.color, count: Math.round(t.count/baseTotal*active) }));
  const shown = scaled.reduce((s,t)=>s+t.count,0) || 1;
  return { active, tiers: scaled, shown };
}
