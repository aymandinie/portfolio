const reportMoney = v => v>=1e6?'RM '+(v/1e6).toFixed(2)+'M':'RM '+Math.round(v/1000)+'k';
// Shared computed rows for the active dimension, already scaled to the selected window.
function reportDimRows(){
  const stateCounts={}; GF_DATA.outlets.forEach(o=>stateCounts[o.state]=(stateCounts[o.state]||0)+1);
  const byState=Object.entries(stateCounts).map(([state,count])=>({state,count})).sort((a,b)=>b.count-a.count);
  const NAVY='#0A3A57';
  const DIMS = {
    category: GF_DATA.topCategories.map(c=>({name:c.name,value:c.value,color:c.color})),
    channel:  [{name:'Hypermarket',value:920000,color:NAVY},{name:'Mall',value:360000,color:'#5B91AE'},{name:'Shoplot',value:140800,color:'#C3D0DA'}],
    payment:  GF_DATA.todaySales.paymentMix.map((p,i)=>({name:p.method,value:p.amount,color:PAYMENT_COLORS[i%PAYMENT_COLORS.length]})),
    grade:    [{name:'999.9 Pure',value:Math.round(4860*315),color:NAVY},{name:'916 Gold',value:Math.round(3560*315),color:'#C2900E'}],
    state:    byState.map(s=>({name:s.state,value:s.count*84000,color:NAVY}))
  };
  let rows = (DIMS[REPORT_DIM]||DIMS.category).slice().sort((a,b)=>b.value-a.value);
  // Respond to the selected window + scope: scale the mix to the windowed revenue so the
  // breakdown numbers move with 7d/30d/90d/custom and the state filter (proportions kept).
  const winRev = (typeof reportWindows==='function') ? reportAgg(reportWindows().cur).rev : 0;
  const seedTotal = rows.reduce((s,r)=>s+r.value,0);
  if (winRev && seedTotal) rows = rows.map(r=>({...r, value: Math.round(r.value/seedTotal*winRev)}));
  return rows;
}
function reportDimInner(){
  const rows = reportDimRows();
  const max = Math.max(...rows.map(r=>r.value)), total = rows.reduce((s,r)=>s+r.value,0);
  return rows.map(r=>{ const pct=total?Math.round(r.value/total*100):0; return `
    <div class="mb-2.5">
      <div class="flex justify-between text-sm mb-1"><span class="flex items-center gap-2 min-w-0"><span class="w-2.5 h-2.5 rounded-sm flex-shrink-0" style="background:${r.color}"></span><span class="font-medium text-navy-950 truncate">${escHtml(r.name)}</span></span><span class="font-mono-tight font-medium text-navy-950 whitespace-nowrap">${reportMoney(r.value)} <span class="text-gray-400 text-xs font-normal">${pct}%</span></span></div>
      <div class="h-2 bg-gray-100 rounded overflow-hidden"><div class="h-full rounded" style="width:${max?Math.round(r.value/max*100):0}%;background:${r.color}"></div></div>
    </div>`; }).join('');
}
// Side panel filling the space next to the bars: leader, runner-up, concentration.
function reportDimSide(){
  const rows = reportDimRows();
  const total = rows.reduce((s,r)=>s+r.value,0) || 1;
  const dimLabel = (REPORT_DIMS.find(d=>d[0]===REPORT_DIM)||['','Category'])[1];
  const leader = rows[0] || {name:'—',value:0,color:'#0A3A57'};
  const second = rows[1];
  const top3 = rows.slice(0,3).reduce((s,r)=>s+r.value,0);
  const stat = (k,v,sub) => `<div class="flex items-baseline justify-between gap-3 py-2 border-b border-gray-100 last:border-0">
    <span class="text-xs text-gray-500">${k}</span>
    <span class="text-right"><span class="serif text-lg text-navy-950 leading-none">${v}</span>${sub?`<span class="block text-[10px] text-gray-400 mt-0.5">${sub}</span>`:''}</span></div>`;
  return `
    <div class="rounded-xl border border-cream-200 bg-cream-50/60 p-4 h-full">
      <div class="text-[10px] tracking-widest uppercase text-gray-500 font-medium mb-1">Leading ${dimLabel.toLowerCase()}</div>
      <div class="flex items-center gap-2 mb-3">
        <span class="w-3 h-3 rounded-sm flex-shrink-0" style="background:${leader.color}"></span>

    </div>`;
}

// with restraint: a soft tonal icon badge + a colour-matched eyebrow on an otherwise clean page.
// NO gradient wash, NO left stripe, NO bright filled chip, NO type-tag pill — those read as slop.
// The colour lives only on the icon (≈10% tint circle + glyph) and the eyebrow; title stays navy.
const DETAIL_ACCENT = {
  receipt:  '#0E7490',  // invoice — teal (cyan-leaning)
  building: '#2F7D4E',  // outlet — green
  tag:      '#9A6E15',  // design code — bronze gold
  card:     '#4B5EA8',  // plan — indigo/periwinkle
  user:     '#022135',  // member — navy
};
function detailHeader(icon, eyebrow, title, sub, actions){
  const c = DETAIL_ACCENT[icon] || '#022135';
  return `<div class="mb-6 pb-5 border-b border-gray-100">
    <div class="flex items-start justify-between gap-4 flex-wrap">
      <div class="flex items-start gap-3.5 min-w-0">
        <div class="w-11 h-11 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" style="background:${c}14;color:${c}"><span class="w-[19px] h-[19px]">${ICONS[icon]||''}</span></div>
        <div class="min-w-0">
          <div class="text-[11px] font-semibold tracking-[0.2em] uppercase mb-1.5" style="color:${c}">${eyebrow}</div>
          <h1 class="serif text-3xl md:text-4xl text-navy-950 font-medium leading-[1.1]">${title}</h1>
          ${sub?`<div class="text-sm text-gray-500 mt-1.5 font-medium">${sub}</div>`:''}
        </div>
      </div>
      ${actions?`<div class="flex gap-2 flex-wrap flex-shrink-0 pt-1">${actions}</div>`:''}
    </div>
  </div>`;
}
function crmBackBar(fallback, crumb){
  return `<div class="mb-5 flex items-center gap-3">
    <button type="button" class="btn-ghost !py-1.5 !px-3.5 !text-sm inline-flex items-center gap-1.5" onclick="crmBack('${fallback}')">${ICONS.chevL||'←'} Back</button>
    <a href="#${fallback}" class="text-xs text-gray-400 hover:text-gold-700 font-medium">${escHtml(crumb)}</a>
  </div>`;
}

// Dedicated invoice detail page — the full breakdown of one sale (#invoice/<no>).
RENDERERS.invoice = (inv) => {
  const t = txnByInvoice(inv);
  if (!t) return `<div class="text-center py-20 text-gray-500">Invoice not found. <a href="#reports/invoices" class="text-gold-700 hover:underline">Back to records</a></div>`;
  if (isOutletScoped() && sessionOutletCode() && t.outletCode !== sessionOutletCode()) {
    setTimeout(()=>{ toast('That invoice belongs to another outlet','warn'); location.hash='outlet/'+sessionOutletCode(); },0);
    return `<div class="text-center py-20 text-gray-500">Redirecting to your outlet…</div>`;
  }
  const oName = {}; (GF_DATA.outlets||[]).forEach(o=>oName[o.code]=o.name);
  const m = (GF_DATA.members||[]).find(x=>x.id===t.memberId);
  const voided = t.reversed || (typeof isSaleVoided==='function' && isSaleVoided(t.memberId, t.invoiceNo));
  const upah = (t.lines||[]).reduce((s,l)=>s+(+l.workmanship||0),0);
  const stat = (l,v,sub) => `<div><div class="text-[10px] uppercase tracking-wider font-medium text-gray-500">${l}</div><div class="text-base font-medium text-navy-950 mt-0.5">${v}</div>${sub?`<div class="text-[11px] text-gray-400">${sub}</div>`:''}</div>`;
  return `
    ${crmBackBar('reports/invoices', 'Sales records')}
    ${detailHeader('receipt', 'Invoice · sales record',
      `${escHtml(t.invoiceNo)} <span class="align-middle ml-1 inline-block">${voided?'<span class="text-[11px] font-medium uppercase tracking-wide text-neg border border-neg/40 rounded-full px-2.5 py-0.5">Voided</span>':'<span class="text-[11px] font-medium uppercase tracking-wide text-pos border border-pos/40 rounded-full px-2.5 py-0.5">Settled</span>'}</span>`,
      `${escHtml(formatDate((t.ts||'').slice(0,10),{written:true}))} · ${escHtml((t.ts||'').slice(11,16))} · <a href="#outlet/${escHtml(t.outletCode)}" class="underline decoration-transparent hover:decoration-current underline-offset-2 hover:text-gold-700">${escHtml(oName[t.outletCode]||t.outletCode)}</a> · ${escHtml(t.source||'keyed')}`,
      `${m?`<a href="#customers/${m.id}" class="btn-ghost">${ICONS.eye||''} View member</a>`:''}${(!voided && typeof can==='function' && can('edit'))?`<button type="button" class="btn-ghost !text-neg" onclick="openVoidRefund('${t.memberId||''}','${escHtml(t.invoiceNo)}')">Void / refund</button>`:''}`)}

    <div class="card mb-4">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-4">
        ${stat('Member', m?`<a href="#customers/${m.id}" class="text-navy-950 underline decoration-gray-300 underline-offset-2 hover:decoration-gold-500 hover:text-gold-700">${escHtml(m.name)}</a>`:'Walk-in', t.memberId?escHtml(t.memberId):'not enrolled')}
        ${(() => { const pl = (GF_DATA.atomePlans||[]).find(x => x.invoiceNo === t.invoiceNo); return stat('Payment', escHtml(t.paymentMethod||'—'), pl?`<a href="#plan/${pl.id}" class="text-gold-700 hover:underline">BNPL · ${escHtml(t.bnpl&&t.bnpl.provider||pl.provider||'')} · view plan</a>`:(t.bnpl?('BNPL · '+escHtml(t.bnpl.provider||'')):'')); })()}
        ${stat('Entered by', escHtml(t.staffId||t.enteredBy||'—'), t.enteredAt?('at '+(t.enteredAt||'').replace('T',' ').slice(0,16)):'')}
        ${stat('Points awarded', voided?'0 (reversed)':fmtNum(t.pointsAwarded||0), t.voucherCode?('voucher '+escHtml(t.voucherCode)):'')}
      </div>
    </div>

    <div class="card !p-0 overflow-hidden mb-4">
      <div class="p-4 border-b border-gray-100"><h3 class="text-lg font-medium text-navy-950">Line items · ${(t.lines||[]).length}</h3></div>
      <div class="overflow-x-auto">
        <table class="gf-table min-w-[720px]">
          <thead><tr><th>Design code</th><th>Category</th><th>Grade</th><th class="text-right">Grams</th><th class="text-right">Gold value</th><th class="text-right">Upah</th><th class="text-right">Other</th><th class="text-right">Line total</th></tr></thead>
          <tbody>
            ${(t.lines||[]).map(l=>`
              <tr>
                <td><button type="button" class="font-mono-tight text-xs text-navy-950 underline decoration-gray-300 underline-offset-2 hover:decoration-gold-500 hover:text-gold-700" onclick="openDesignCode('${escHtml(l.designCode||'')}')">${escHtml(l.designCode||'—')}</button></td>
                <td class="text-sm text-navy-950">${escHtml(catLabel(l.category))}</td>
                <td class="text-xs text-gray-700">${escHtml(l.grade||'—')}</td>
                <td class="text-right text-xs font-mono-tight">${l.grams}g</td>
                <td class="text-right text-xs font-mono-tight">${fmtRM(l.goldValue||0)}</td>
                <td class="text-right text-xs font-mono-tight">${fmtRM(l.workmanship||0)}</td>
                <td class="text-right text-xs font-mono-tight">${fmtRM(l.otherCharges||0)}</td>
                <td class="text-right text-sm font-medium font-mono-tight">${fmtRM(l.lineTotal||0)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="p-4 border-t border-gray-100 flex flex-col items-end gap-1 text-sm">
        <div class="flex gap-8"><span class="text-gray-500">Gross</span><span class="font-medium font-mono-tight text-navy-950 w-36 text-right whitespace-nowrap">${fmtRM(t.grossTotal||0)}</span></div>
        <div class="flex gap-8"><span class="text-gray-500">Workmanship (upah)</span><span class="font-mono-tight text-gray-600 w-36 text-right whitespace-nowrap">${fmtRM(upah)}</span></div>
        ${t.voucherValue?`<div class="flex gap-8"><span class="text-gray-500">Voucher ${escHtml(t.voucherCode||'')}</span><span class="font-mono-tight text-pos w-36 text-right whitespace-nowrap">− ${fmtRM(t.voucherValue)}</span></div>`:''}
        <div class="flex gap-8 pt-1 border-t border-gray-100 mt-1 items-baseline"><span class="font-medium text-navy-950">Net paid</span><span class="serif text-xl font-medium text-navy-950 w-36 text-right whitespace-nowrap">${fmtRM(t.netPaid||t.grossTotal||0)}</span></div>
      </div>
    </div>`;
};

// Dedicated installment-plan page (#plan/<id>) — the full record, every ID clickable.
RENDERERS.plan = (id) => {
  const p = (GF_DATA.atomePlans||[]).find(x => x.id === id);
  if (!p) return `<div class="text-center py-20 text-gray-500">Plan not found. <a href="#atome/overview" class="text-gold-700 hover:underline">Back to installments</a></div>`;
  if (isOutletScoped() && SESSION.outlet && p.outlet !== SESSION.outlet) {
    setTimeout(()=>{ toast('That plan belongs to another outlet','warn'); location.hash='atome/overview'; },0);
    return `<div class="text-center py-20 text-gray-500">Redirecting…</div>`;
  }
  const m = (GF_DATA.members||[]).find(x=>x.id===p.memberId);
  const invExists = (typeof txnByInvoice==='function') && txnByInvoice(p.invoiceNo);
  const monthPct = p.paidMonths/p.totalMonths;
  const sync = (typeof providerSyncDate==='function') ? providerSyncDate(p.provider) : null;
  const stat = (l,v,sub) => `<div><div class="text-[10px] uppercase tracking-wider font-medium text-gray-500">${l}</div><div class="text-base font-medium text-navy-950 mt-0.5">${v}</div>${sub?`<div class="text-[11px] text-gray-400">${sub}</div>`:''}</div>`;
  return `
    ${crmBackBar('atome/overview', 'Installments')}
    ${detailHeader('card', `${escHtml(p.id)} · ${escHtml(p.provider)}`,
      escHtml(p.customer),
      `${escHtml(p.item)} · ${escHtml(p.material)}`,
      (typeof bnplStatusPill==='function')?bnplStatusPill(p):'')}

    <div class="card mb-4">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-4">
        ${stat('Plan value', fmtRM(p.total))}
        ${stat('Est. instalment', fmtRM(Math.round(p.total/p.totalMonths))+'/mo')}
        ${stat('Member', m?`<a href="#customers/${m.id}" class="text-navy-950 underline decoration-gray-300 underline-offset-2 hover:decoration-gold-500 hover:text-gold-700">${escHtml(m.name)}</a>`:'Walk-in', p.memberId?escHtml(p.memberId):'')}
        ${stat('Invoice', invExists?`<a href="#invoice/${escHtml(p.invoiceNo)}" class="text-navy-950 underline decoration-gray-300 underline-offset-2 hover:decoration-gold-500 hover:text-gold-700 font-mono-tight">${escHtml(p.invoiceNo)}</a>`:`<span class="font-mono-tight">${escHtml(p.invoiceNo)}</span>`, (() => { const oc = ((GF_DATA.outlets||[]).find(o=>o.name===p.outlet)||{}).code; return oc?`<a href="#outlet/${oc}" class="hover:text-gold-700 underline decoration-transparent hover:decoration-current underline-offset-2">${escHtml(p.outlet)}</a>`:escHtml(p.outlet||''); })())}
        ${stat('Started', escHtml(p.startDate||''))}
        ${stat('Term', p.totalMonths+' months')}
        ${stat('Progress', p.paidMonths+' / '+p.totalMonths+' elapsed')}
        ${stat('Last synced', sync?formatDate(sync,{written:true}):'—', p.provider+' file')}
      </div>
    </div>

    <div class="card mb-4">
      <div class="flex items-center justify-between mb-3">
        <div class="text-xs text-gray-500 uppercase tracking-wider font-medium">${p.totalMonths}-month schedule</div>
        <div class="text-[11px] text-gray-500 font-medium"><span class="text-gold-700 font-medium">${p.paidMonths}</span> / ${p.totalMonths} elapsed (est.)</div>
      </div>
      <div class="relative" style="height:22px;">
        <div class="absolute top-1/2 -translate-y-1/2 h-0.5 bg-gray-200" style="left:6px; right:6px;"></div>
        <div class="absolute top-1/2 -translate-y-1/2 h-0.5 bg-gold-500" style="left:6px; width:calc((100% - 12px) * ${monthPct});"></div>
        <div class="absolute inset-0 flex justify-between items-center">
          ${Array.from({length:p.totalMonths}, (_,i) => { const elapsed=i<p.paidMonths, isCurrent=i===p.paidMonths; const sz=isCurrent?'w-3.5 h-3.5':'w-2.5 h-2.5'; return `<div class="${sz} rounded-full ${elapsed?'bg-gold-500':'bg-white'} border-2 ${elapsed?'border-gold-500':'border-gray-300'} relative z-10" ${isCurrent?'style="box-shadow:0 0 0 3px rgba(250,200,5,0.25)"':''} title="Month ${i+1}"></div>`; }).join('')}
        </div>
      </div>
      <div class="text-[11px] text-gray-400 mt-3">Estimated from plan term and start date. Goldfinch is paid in full at point of sale and does not receive repayment data from the provider.</div>

};

/* ============================================================
   Per-OUTLET page (#outlet/<code>) — one place to see everything about a single
   outlet: its customers, its sales records, its installment plans. The vehicle
   for outlet-scoped roles (Store Manager / Cashier) to review their own store. §HQ
   ============================================================ */
// Resolve the signed-in user's own outlet code (scoped roles are pinned to one store).
function sessionOutletCode(){
  const nm = (typeof SESSION!=='undefined' && SESSION.outlet) || '';
  const o = (GF_DATA.outlets||[]).find(x => x.name === nm || nm.indexOf(x.name) > -1);
  return o ? o.code : null;
}
RENDERERS.outlet = (code) => {
  const o = (GF_DATA.outlets||[]).find(x => x.code === code);
  if (!o) return `<div class="text-center py-20 text-gray-500">Outlet not found. <a href="#reports" class="text-gold-700 hover:underline">Back to reports</a></div>`;
  // Outlet-scoped roles may only open their OWN outlet.
  if (typeof isOutletScoped==='function' && isOutletScoped() && sessionOutletCode() && code !== sessionOutletCode()) {
    setTimeout(()=>{ toast('You can only view your own outlet','warn'); location.hash = 'outlet/'+sessionOutletCode(); }, 0);
    return `<div class="text-center py-20 text-gray-500">Redirecting to your outlet…</div>`;
  }
  const custs = (GF_DATA.members||[]).filter(m => m.outlet === o.name);
  const invs  = (GF_DATA.transactions||[]).filter(t => t.outletCode === code);
  const plans = (GF_DATA.atomePlans||[]).filter(p => p.outlet === o.name);
  const live  = invs.filter(t => !t.reversed);
  const rev   = live.reduce((s,t)=>s+(t.grossTotal||0),0);
  const avg   = rev/Math.max(1,live.length);
  const activePlans = plans.filter(p => p.paidMonths < p.totalMonths).length;
  const back  = (typeof isOutletScoped==='function' && isOutletScoped()) ? '' : crmBackBar('reports','Sales & Reports');
  const kpi = (l,v,sub,tone) => `<div class="card !p-4"><div class="text-[10px] uppercase tracking-wider font-medium text-gray-500">${l}</div><div class="serif text-2xl font-medium ${tone||'text-navy-950'} mt-0.5">${v}</div>${sub?`<div class="text-[11px] text-gray-400 mt-0.5">${sub}</div>`:''}</div>`;
  return `
    ${back}
    ${detailHeader('building', `${escHtml(o.code)} · ${escHtml(o.state)} · ${escHtml(o.channel||'outlet')}`,
      escHtml(o.name),
      `${escHtml(o.host||'')}${o.host?' · ':''}${fmtNum(custs.length)} members on file`,
      (typeof can==='function' && can('editCompany'))?`<button type="button" class="btn-ghost" onclick="openOutletEdit('${o.code}')">${ICONS.pencil} Edit outlet</button>`:'')}

    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
      ${kpi('Revenue', fmtRM(Math.round(rev)), 'captured in ledger')}
      ${kpi('Invoices', fmtNum(invs.length), 'sales records')}
      ${kpi('Avg sale', fmtRM(Math.round(avg)), 'gross / invoice')}
      ${kpi('Customers', fmtNum(custs.length), 'members here', 'text-gold-700')}
      ${kpi('Active plans', fmtNum(activePlans), plans.length+' total')}
    </div>

    <div class="card !p-0 overflow-hidden mb-4">
      <div class="p-4 border-b border-gray-100"><h3 class="text-lg font-medium text-navy-950">Customers · ${fmtNum(custs.length)}</h3><p class="text-xs text-gray-500 font-medium mt-0.5">Members whose home outlet is ${escHtml(o.name)}.</p></div>
      <div id="outletCustomers" class="p-2"></div>
    </div>

    <div class="card !p-0 overflow-hidden mb-4">
      <div class="p-4 border-b border-gray-100"><h3 class="text-lg font-medium text-navy-950">Sales records · ${fmtNum(invs.length)}</h3><p class="text-xs text-gray-500 font-medium mt-0.5">Every invoice rung up at this outlet — open any one for the full breakdown.</p></div>
      <div id="outletInvoices" class="p-2"></div>
    </div>

    <div class="card !p-0 overflow-hidden mb-4">
      <div class="p-4 border-b border-gray-100"><h3 class="text-lg font-medium text-navy-950">Installment plans · ${fmtNum(plans.length)}</h3><p class="text-xs text-gray-500 font-medium mt-0.5">BNPL plans originated at this outlet.</p></div>
      <div id="outletPlans" class="p-2"></div>
    </div>`;
};
POSTRENDER.outlet = (code) => {

  const tierPillR = m => (typeof tierPill==='function') ? tierPill(m.tier) : escHtml(m.tier);
  // Customers
  const cmount = document.getElementById('outletCustomers');
  if (cmount) DataTable({
    id:'outletCust', mount:cmount, rows:(GF_DATA.members||[]).filter(m=>m.outlet===o.name), rowKey:'id', minWidth:820,

    defaultSort:{key:'spendYTD',dir:'desc'}, pageSize:10,
    filters:[{key:'tier',label:'Tier',type:'multi',options:['entry','bronze','silver','gold']}],
    columns:[
      {key:'name',label:'Member',width:'34%',sortable:true,render:m=>`<div class="font-medium text-navy-950 truncate">${escHtml(m.name)}</div><div class="text-[11px] text-gray-500 font-mono-tight">${escHtml(m.id)}</div>`},
      {key:'tier',label:'Tier',width:'14%',sortable:true,sortValue:m=>['entry','bronze','silver','gold'].indexOf(m.tier),render:m=>tierPillR(m)},

      {key:'_v',label:'',width:'22%',align:'right',render:m=>`<button type="button" class="btn-primary !py-1.5 !px-3 !text-xs whitespace-nowrap" onclick="location.hash='customers/'+'${m.id}'">${ICONS.eye} View</button>`}

    DataTable({
      id:'outletInv', mount:imount, rows, rowKey:'invoiceNo', minWidth:860,
      searchKeys:['invoiceNo','_member','memberId','paymentMethod'], searchPlaceholder:'Search this outlet’s invoices…',
      defaultSort:{key:'ts',dir:'desc'}, pageSize:10,
      filters:[{key:'paymentMethod',label:'Payment',type:'multi',options:[...new Set(rows.map(r=>r.paymentMethod).filter(Boolean))]}],
      columns:[
        {key:'invoiceNo',label:'Invoice',width:'22%',sortable:true,render:t=>`<span class="font-mono-tight text-xs text-navy-950 whitespace-nowrap">${escHtml(t.invoiceNo)}</span>`},
        {key:'ts',label:'Date',width:'14%',sortable:true,render:t=>`<span class="text-xs text-gray-600 whitespace-nowrap">${escHtml(formatDate(t._date,{written:true}))}</span>`},
        {key:'_member',label:'Member',width:'24%',sortable:true,render:t=>`<div class="text-sm text-navy-950 truncate">${escHtml(t._member)}</div>`},
        {key:'grossTotal',label:'Amount',width:'16%',align:'right',sortable:true,render:t=>`<span class="font-medium font-mono-tight whitespace-nowrap ${t._voided?'line-through text-gray-400':''}">${fmtRM(Math.round(t.grossTotal))}</span>`},
        {key:'_v',label:'',width:'16%',align:'right',render:t=>`<button type="button" class="btn-primary !py-1.5 !px-3 !text-xs whitespace-nowrap" onclick="location.hash='invoice/${escHtml(t.invoiceNo)}'">${ICONS.eye} Open</button>`}
      ],
      emptyState:{title:'No sales yet',body:'No invoices captured for this outlet.'}
    });
  }
  // Plans
  const pmount = document.getElementById('outletPlans');
  if (pmount){
    const rows=(GF_DATA.atomePlans||[]).filter(p=>p.outlet===o.name);
    DataTable({
      id:'outletPlans', mount:pmount, rows, rowKey:'id', minWidth:820,
      searchKeys:['id','customer','invoiceNo','item'], searchPlaceholder:'Search this outlet’s plans…',
      defaultSort:{key:'total',dir:'desc'}, pageSize:10,
      filters:[{key:'provider',label:'Provider',type:'multi',options:[...new Set(rows.map(r=>r.provider))]}],
      columns:[
        {key:'id',label:'Plan',width:'14%',render:p=>`<span class="font-mono-tight text-xs text-gray-700 whitespace-nowrap">${escHtml(p.id)}</span>`},
        {key:'customer',label:'Customer',width:'26%',sortable:true,render:p=>`<div class="font-medium text-navy-950 text-sm truncate">${escHtml(p.customer)}</div>`},
        {key:'provider',label:'Provider',width:'16%',render:p=>(typeof providerBadge==='function')?providerBadge(p.provider):escHtml(p.provider)},
        {key:'total',label:'Value',width:'14%',align:'right',sortable:true,render:p=>`<span class="font-medium font-mono-tight whitespace-nowrap">${fmtRM(p.total)}</span>`},
        {key:'_v',label:'',width:'14%',align:'right',render:p=>`<button type="button" class="btn-primary !py-1.5 !px-3 !text-xs whitespace-nowrap" onclick="location.hash='plan/${p.id}'">${ICONS.eye} View</button>`}
      ],
      emptyState:{title:'No plans',body:'No installment plans at this outlet.'}
    });
  }
};


function designCodesFiltered(){
  const q = DESIGN_SEARCH.toLowerCase().trim();
  return (GF_DATA.designCodes||[]).filter(d => !q || (d.sku+' '+d.name+' '+d.material+' '+d.category+' '+d.en).toLowerCase().includes(q));
}
function setDesignSearch(v){ DESIGN_SEARCH = v; DESIGN_PAGE = 0; renderDesignCodes(); }
function setDesignPage(n){ DESIGN_PAGE = n; renderDesignCodes(); }
function renderDesignCodes(){ const el = document.getElementById('designCodesWrap'); if(el) el.innerHTML = designCodesInner(); }
function designCodesInner(){
  const all = designCodesFiltered();
  // Units + revenue follow the master range like every other figure on the page — the seed
  // values are authored for the default 30-day window, so scale by days/30 (network-wide).
  const factor = (typeof reportWindows === 'function') ? Math.max(0.05, reportWindows().days/30) : 1;
  const scaled = all.map(s => ({ ...s, sold: Math.max(1, Math.round(s.sold*factor)), revenue: Math.round(s.revenue*factor) }));
  const { key, dir } = DESIGN_SORT;
  const cmp = (a,b) => { let av=a[key], bv=b[key]; if (typeof av==='string'){ av=av.toLowerCase(); bv=(bv||'').toLowerCase(); return av<bv?-1:av>bv?1:0; } return (av||0)-(bv||0); };
  scaled.sort((a,b) => dir==='asc' ? cmp(a,b) : -cmp(a,b));
  const pages = Math.max(1, Math.ceil(scaled.length / DESIGN_PAGE_SIZE));
  const page = Math.min(DESIGN_PAGE, pages-1);
  const rows = scaled.slice(page*DESIGN_PAGE_SIZE, page*DESIGN_PAGE_SIZE + DESIGN_PAGE_SIZE);
  const arrow = k => DESIGN_SORT.key===k ? `<span class="text-gold-700">${DESIGN_SORT.dir==='asc'?'▲':'▼'}</span>` : '';

function donutChart(data, opts = {}) {
  const total = data.reduce((s,d) => s+d.value, 0);
  let offset = 0;
  const r = 50, c = 2 * Math.PI * r;
  const big = opts.big != null ? opts.big : '12.8K';
  const small = opts.small != null ? opts.small : 'MEMBERS';
  return `
    <div class="relative" style="width:140px;height:140px;">
      <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90">
        <defs>
          <linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FBEBA6"/><stop offset="38%" stop-color="#F2C21A"/>
            <stop offset="74%" stop-color="#C2900E"/><stop offset="100%" stop-color="#9A6E15"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="${r}" fill="none" stroke="#F3F4F6" stroke-width="14"/>
        ${data.map(d => {
          const dash = (d.value/total) * c;
          const stroke = (d.color === '#F2C21A' || d.color === '#FFC400') ? 'url(#goldMetal)' : d.color;
          const el = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${stroke}" stroke-width="14"
            stroke-dasharray="${dash} ${c-dash}" stroke-dashoffset="${-offset}" />`;
          offset += dash;
          return el;
        }).join('')}
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-2">
        <div class="serif text-xl text-navy-950 leading-none">${big}</div>
        <div class="text-[9px] text-gray-500 tracking-widest mt-0.5">${small}</div>
      </div>
    </div>`;
}

/* ------------------------------------------------------------------
   In-session store — IN-MEMORY ONLY (no browser storage). State a cashier
   keys in lives for the session and resets on reload, per the standing
   "front-end, in-memory, no persistence" rule. Same API as before so
   callers are unchanged; save() is a no-op.
------------------------------------------------------------------- */
const GFP = {
  _d: {},
  load(){ return this._d; },
  save(){ /* in-memory only — intentionally persists nothing */ },
  get(k, d){ return (k in this._d) ? this._d[k] : d; },
  set(k, v){ this._d[k] = v; }
};
// Replay persisted purchases into member histories so they show up everywhere
(function applyPersisted(){
  const saved = GFP.get('purchases', []);
  saved.forEach(p => {
    if (!GF_DATA.purchaseHistory[p.memberId]) GF_DATA.purchaseHistory[p.memberId] = [];
    GF_DATA.purchaseHistory[p.memberId].unshift(p);
    const m = GF_DATA.members.find(x => x.id === p.memberId);
    if (m) { m.points = (m.points||0) + Math.round(p.amount/10); m.spendYTD = (m.spendYTD||0) + p.amount; }
  });
  // replay created members + member edits
  const newMembers = GFP.get('members', []);
  newMembers.forEach(nm => { if (!GF_DATA.members.some(x=>x.id===nm.id)) GF_DATA.members.unshift(nm); });
  const memberEdits = GFP.get('memberEdits', {});
  GF_DATA.members.forEach(m => { if (memberEdits[m.id]) Object.assign(m, memberEdits[m.id]); });
  GF_DATA._mops = { created: newMembers, edited: memberEdits };
  // replay voucher create/edit/delete so pool changes stick across reloads
  const vops = GFP.get('voucherOps', { created:[], edited:{}, deleted:[] });
  GF_DATA._vops = vops;
  if (vops.deleted && vops.deleted.length) GF_DATA.vouchers = GF_DATA.vouchers.filter(v => !vops.deleted.includes(v.id));
  if (vops.edited) GF_DATA.vouchers.forEach(v => { if (vops.edited[v.id]) Object.assign(v, vops.edited[v.id]); });
  (vops.created||[]).forEach(v => { if (!GF_DATA.vouchers.some(x=>x.id===v.id)) GF_DATA.vouchers.unshift(v); });
  // restore sidebar collapse preference (reuse the same toggle so all classes apply)
  if (GFP.get('collapsed', false) && document.getElementById('sidebar')) toggleCollapse();
  // Reconcile each member's Total spend to the EXACT sum of their purchase history (the ledger),
  // so the profile card, the members table and the history "Lifetime spend" always show one figure.
  GF_DATA.members.forEach(m => { m.spendYTD = memberPurchases(m).reduce((s, pp) => s + (pp.amount || 0), 0); });
})();

function resetAuthAnim(){
  const o=document.getElementById('authOverlay'); if(o) o.classList.remove('is-blur');
  const stage=document.getElementById('authStage'); if(stage) stage.classList.remove('is-intro','is-signing');
  const hero=document.getElementById('authHero'); if(hero){ hero.style.transition='none'; hero.style.transform=''; }
  const bar=document.getElementById('authLoaderBar'); if(bar){ bar.classList.add('hidden'); bar.classList.remove('flex'); }
}
function showAuth(){
  const o=document.getElementById('authOverlay'); o.classList.remove('hidden','is-blur'); o.classList.add('flex');
  const bar=document.getElementById('authLoaderBar'); if(bar){ bar.classList.add('hidden'); bar.classList.remove('flex'); }
  renderAuthHero(); renderAuth();
  const stage=document.getElementById('authStage'); const hero=document.getElementById('authHero');
  if (stage) stage.classList.remove('is-signing');
  if (stage && hero) {
    stage.classList.add('is-intro');
    // Intro: centre the logo INSTANTLY (no glide on the first frame), hold ~1.3s, then glide it
    // to the top while the card fades in and the background cross-fades to blur.
    requestAnimationFrame(()=>{
      hero.style.transition='none'; hero.style.transform='';
      const dy=authHeroDy();
      hero.style.transform=`translateY(${dy}px)`;
      void hero.offsetWidth;
      hero.style.transition='';
      setTimeout(()=>{ hero.style.transform=''; stage.classList.remove('is-intro'); o.classList.add('is-blur'); }, 1300);
    });
  }
}
// The animated brand hero renders ONCE per sign-in (separate from #authCard, which
// re-renders on every role click) so the bird/wordmark animation never replays mid-flow.
function renderAuthHero(){ const el=document.getElementById('authHero'); if(!el) return; el.innerHTML = authHeroView(); }
function authHeroView(){
  // Gold-dust motes — deterministic positions/timings (left%, delay s, duration s, size px).
  const dust = [[12,0,4.2,4],[22,1.1,4.8,3],[34,.4,3.9,5],[46,1.6,5.1,3],[58,.2,4.4,4],[68,1.3,4.9,3],[78,.7,4.1,5],[88,1.9,5.3,3],[16,2.4,4.6,4],[52,2.8,4.2,3],[72,2.2,5.0,4]]
    .map(([l,d,dur,sz])=>`<i style="left:${l}%;width:${sz}px;height:${sz}px;animation-delay:${d}s;animation-duration:${dur}s"></i>`).join('');
  // The real brand asset (logo-full.png), whitened for the dark canvas and animated in.
  return `
    <div class="gf-auth-hero">
      <div class="gf-auth-glow"></div>
      <div class="gf-dust">${dust}</div>
      <img src="assets/logo-full.png" onerror="this.onerror=null;this.src='assets/logo.svg'" alt="Goldfinch Jewelry" class="gf-auth-logo gf-auth-img" />
      <div class="gf-auth-tag">Goldfinch CRM · Staff sign-in</div>
    </div>`;
}
function hideAuth(){ const o=document.getElementById('authOverlay'); o.classList.add('hidden'); o.classList.remove('flex'); }
function setAuthRole(r){ AUTH_ROLE=r; renderAuth(); }
function renderAuth(){
  const el=document.getElementById('authCard'); if(!el) return;
  el.innerHTML = AUTH_VIEW==='reset' ? authResetView() : AUTH_VIEW==='onboard' ? authOnboardView() : authLoginView();
}
function brandMark(){
  return `<div class="flex items-center gap-2.5 justify-center mb-6"><img src="assets/logo-full.png" onerror="this.style.display='none'" style="height:34px" alt="Goldfinch"/><span class="serif text-2xl text-white font-medium" style="letter-spacing:.02em">Goldfinch CRM</span></div>`;
}
function authLoginView(){
  const meta = ROLE_META[AUTH_ROLE];
  const roleCard = (r) => { const m=ROLE_META[r]||{}; const on=AUTH_ROLE===r; return `
    <button type="button" onclick="setAuthRole('${r}')" class="w-full text-left px-3 py-2.5 rounded-lg border transition ${on?'border-gold-500 bg-cream-50':'border-gray-200 hover:border-gold-500/50'}">
      <div class="flex items-center justify-between"><span class="text-sm font-medium text-navy-950">${r}</span>${on?`<span class="w-4 h-4 text-gold-700">${ICONS.check}</span>`:''}</div>
      <div class="text-[11px] text-gray-500 mt-0.5">${m.blurb||''}</div>
    </button>`; };
  return `
    <div class="bg-white rounded-2xl p-6 shadow-xl border border-black/10">
      <h1 class="serif text-2xl text-navy-950 font-medium">Sign in</h1>
      <p class="text-sm text-gray-500 font-medium mt-0.5 mb-4">Choose a role to preview its permissions.</p>
      <label class="text-[10px] tracking-widest font-medium text-gray-500 mb-1 block">EMAIL</label>
      <input id="authEmail" value="${meta.email}" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm mb-3"/>
      <label class="text-[10px] tracking-widest font-medium text-gray-500 mb-1 block">PASSWORD</label>
      <input id="authPass" type="password" value="demo-access" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm mb-1"/>
      <div class="text-right mb-4"><button type="button" class="text-xs text-gold-700 font-medium hover:underline" onclick="AUTH_VIEW='reset'; renderAuth()">Forgot password?</button></div>
      <div class="space-y-2 mb-5">${window.GF_ROLES.map(roleCard).join('')}</div>
      <button type="button" class="btn-gold w-full justify-center !py-3" onclick="doSignIn(AUTH_ROLE)">${ICONS.check} Sign in as ${AUTH_ROLE}</button>
    </div>
    <p class="text-center text-[11px] text-white/40 mt-4">Front-end demo · in-memory session · no real credentials</p>`;
}
function authResetView(){
  return `
    <div class="bg-white rounded-2xl p-6 shadow-xl border border-black/10">
      <h1 class="serif text-2xl text-navy-950 font-medium">Reset password</h1>
      <p class="text-sm text-gray-500 font-medium mt-0.5 mb-4">Enter your email and we'll send a reset link.</p>
      <label class="text-[10px] tracking-widest font-medium text-gray-500 mb-1 block">EMAIL</label>
      <input value="${ROLE_META[AUTH_ROLE].email}" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm mb-4"/>
      <button type="button" class="btn-gold w-full justify-center !py-3 mb-2" onclick="toast('Reset link sent (demo)','success'); AUTH_VIEW='login'; renderAuth()">${ICONS.send} Send reset link</button>
      <button type="button" class="btn-ghost w-full justify-center" onclick="AUTH_VIEW='login'; renderAuth()">← Back to sign in</button>
    </div>`;
}
let ONBOARD_STEP = 0;
const ONBOARD_STEPS = [
  { icon:'cart',      title:'Key in every sale',        body:'New Sale enrols the customer by default, captures gold value + workmanship, and posts points through the loyalty engine.' },
  { icon:'broadcast', title:'Reach members that opt in',body:'Send from approved templates; reach excludes opted-out members and shows the cost before you send.' },
  { icon:'chart',     title:'Read the numbers',         body:'Sales & Reports covers all 67 outlets from the dated ledger. BNPL is adoption & exposure only — never a receivable.' }
];
function authOnboardView(){
  const s = ONBOARD_STEPS[ONBOARD_STEP];
  const dots = ONBOARD_STEPS.map((_,i)=>`<span class="w-2 h-2 rounded-full ${i===ONBOARD_STEP?'bg-gold-500':'bg-gray-200'}"></span>`).join('');
  const last = ONBOARD_STEP === ONBOARD_STEPS.length-1;
  return `
    ${brandMark()}
    <div class="bg-white rounded-2xl p-6 shadow-xl border border-black/10 text-center">
      <div class="w-14 h-14 rounded-2xl bg-cream-50 border border-cream-200 text-gold-700 flex items-center justify-center mx-auto mb-4"><span class="w-7 h-7">${ICONS[s.icon]}</span></div>
      <h1 class="serif text-2xl text-navy-950 font-medium">${s.title}</h1>
      <p class="text-sm text-gray-600 font-medium mt-2 mb-5 max-w-xs mx-auto">${s.body}</p>
      <div class="flex items-center justify-center gap-1.5 mb-5">${dots}</div>
      <div class="flex gap-2">
        <button type="button" class="btn-ghost justify-center flex-1" onclick="finishAuth()">Skip</button>
        <button type="button" class="btn-gold justify-center flex-1" onclick="${last?'finishAuth()':'ONBOARD_STEP++; renderAuth()'}">${last?'Get started':'Next →'}</button>
      </div>
    </div>`;
}
function showCrmLoader(){ const l=document.getElementById('crmLoader'); if(l){ l.classList.remove('hidden'); l.classList.add('is-on','flex'); } }
function hideCrmLoader(){ const l=document.getElementById('crmLoader'); if(l){ l.classList.add('hidden'); l.classList.remove('is-on','flex'); } }
function doSignIn(role){
  try { localStorage.setItem('gf_crm_role', role); } catch(e){}   // persist → refresh stays signed in
  const m = ROLE_META[role] || ROLE_META[(window.GF_ROLES||[])[0]] || {};
  signIn(role, m.user, m.outlet);
  syncSessionUI();
  // Sign-in loader — the same overlay: the logo glides BACK to centre, the card fades out, and
  // the loading bar fades in beneath it (one continuous logo, no separate splash element).
  const o=document.getElementById('authOverlay');
  const stage=document.getElementById('authStage'); const hero=document.getElementById('authHero');
  const bar=document.getElementById('authLoaderBar');
  if (stage && hero) { stage.classList.add('is-signing'); hero.style.transition=''; hero.style.transform=`translateY(${authHeroDy()}px)`; }
  if (bar) { bar.classList.remove('hidden'); bar.classList.add('flex'); }
  // Hold on the loader (~2s), then render the dashboard BEHIND the overlay and dissolve the
  // overlay away over it — a fluid hand-off rather than an instant swap.
  setTimeout(() => {
    AUTH_VIEW='login'; renderNav();
    const home = roleHome();
    if (('#'+home) !== location.hash) location.hash = '#'+home; else route();
    o.classList.add('is-fading');
    setTimeout(() => { o.classList.add('hidden'); o.classList.remove('flex','is-fading','is-blur'); resetAuthAnim(); toast('Signed in as '+SESSION.role,'success'); }, 640);
  }, 1950);
}
function finishAuth(){ AUTH_VIEW='login'; hideAuth(); renderNav(); const home = roleHome(); if (('#'+home) !== location.hash) location.hash = '#'+home; else route(); toast('Signed in as '+SESSION.role,'success'); }
function doSignOut(){ closeAvatarMenu(); try { localStorage.removeItem('gf_crm_role'); } catch(e){} signOutCRM(); AUTH_VIEW='login'; resetAuthAnim(); showAuth(); }
function syncSessionUI(){
  document.body.dataset.role = SESSION.role || '';
  const m = ROLE_META[SESSION.role] || {};
  const set = (id,txt)=>{ const e=document.getElementById(id); if(e) e.textContent=txt; };
  set('avatarInitials', initials(SESSION.user||'GF'));
  set('avatarName', SESSION.user||''); set('avatarRole', (SESSION.role||'')+' · '+(SESSION.outlet||''));
  set('avatarMenuName', SESSION.user||''); set('avatarMenuRole', (SESSION.role||'')+' · '+(SESSION.outlet||''));
  set('topbarDate', demoDateLabel(false));
  // Persistent "New Sale" in the topbar for any role that keys in sales (Cashier, Store Manager,
  // HQ Admin) — so key-in is one tap from every page, not just the dashboard.
  const nsb = document.getElementById('topbarNewSale');
  if (nsb) nsb.classList.toggle('hidden', !(typeof can==='function' && can('create')));
  if (typeof setKbdHint === 'function') setKbdHint();   // ⌘K on macOS, Ctrl K on Windows
}
function toggleAvatarMenu(){ const m=document.getElementById('avatarMenu'); if(m) m.classList.toggle('hidden'); }
function closeAvatarMenu(){ const m=document.getElementById('avatarMenu'); if(m) m.classList.add('hidden'); }
document.addEventListener('click', e => { const w=document.getElementById('avatarBtn'); const m=document.getElementById('avatarMenu'); if(m && !m.classList.contains('hidden') && !w.contains(e.target) && !m.contains(e.target)) closeAvatarMenu(); });
// can()-gated fragment helper — returns html only when the role permits the action.
function gate(action, html){ return (typeof can==='function' && can(action)) ? html : ''; }
// Cashier sees own-outlet data only (roles matrix). HQ Admin + Store Manager see all.
// Store Manager AND Cashier are pinned to their own outlet — they see/act on their store's
// members, invoices and plans only. HQ Admin is network-wide.
function isOutletScoped(){ const R = window.GF_ROLES||[]; return typeof SESSION!=='undefined' && (SESSION.role === R[1] || SESSION.role === R[2]); }
// May this role open invoice / plan / outlet record pages? HQ + Store Manager via the
// 'reports' capability; a Cashier via their outlet scope (own-outlet records only).
function canViewRecords(){ return (typeof can==='function' && can('reports')) || isOutletScoped(); }
function scopedMembers(){
  const all = GF_DATA.members;
  return (isOutletScoped() && SESSION.outlet) ? all.filter(m => m.outlet === SESSION.outlet) : all;
}

/* Boot — the sign-in screen shows FIRST. A previously-signed-in session is persisted
   (localStorage 'gf_crm_role'), so a refresh drops you straight back to the dashboard;
   arriving fresh from the index (which clears the key) always shows the branded login. */
(function(){
  let saved = null; try { saved = localStorage.getItem('gf_crm_role'); } catch(e){}
  const roles = window.GF_ROLES || [];
  if (saved && roles.indexOf(saved) > -1) {                 // returning session → straight in
    const m = ROLE_META[saved] || {};
    if (typeof signIn === 'function') signIn(saved, m.user, m.outlet);
    syncSessionUI();
    route();
  } else {                                                   // fresh → render behind, show login
    if (typeof can === 'function') can('view');              // resolve a default role for the backdrop
    const m = ROLE_META[SESSION.role]; if (m) { SESSION.user = m.user; SESSION.outlet = m.outlet; }
    syncSessionUI();
    route();
    showAuth();
  }
})();

/* Deep-link / demo hook: ?plan=ID or ?trigger=ID auto-opens the detail modal */
(function(){
  const q = new URLSearchParams(location.search);
  if (q.get('plan'))    setTimeout(() => openPlanModal(q.get('plan')), 150);
  if (q.get('trigger')) setTimeout(() => openTriggerModal(q.get('trigger')), 150);
})();
</script>
